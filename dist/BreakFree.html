  <style>
:root {
  color-scheme: light;
  --cream: #fbf3e8;
  --cream-2: #fff8ec;
  --sand: #f0e2cb;
  --peach: #f7d9b6;
  --rose: #ecb4a6;
  --terracotta: #c0734f;
  --terracotta-ink: #8a4824;
  --moss: #7c8c5b;
  --moss-ink: #4a5a30;
  --amber: #e2a44a;
  --cocoa: #3a2a22;
  --cocoa-2: #5a4337;
  --muted: #8a7a6c;
  --line: #e9dcc6;
  --shadow: 0 18px 60px rgba(80, 50, 30, 0.10);
  --shadow-soft: 0 8px 28px rgba(80, 50, 30, 0.08);
  --radius-lg: 28px;
  --radius-md: 18px;
  --radius-sm: 12px;
  --gap: 18px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background:
    radial-gradient(1200px 700px at -10% -20%, #fff1d8 0%, transparent 60%),
    radial-gradient(900px 600px at 110% 0%, #ffe1c4 0%, transparent 55%),
    radial-gradient(900px 700px at 50% 120%, #f6dcb6 0%, transparent 60%),
    var(--cream);
  color: var(--cocoa);
  font-family: "Söhne", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  font-feature-settings: "ss01", "ss02";
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button, input, textarea, select {
  font: inherit;
  color: inherit;
}

button { cursor: pointer; }

h1, h2, h3 {
  letter-spacing: -0.02em;
  line-height: 1.05;
  margin: 0;
}

h1 { font-size: clamp(28px, 4.2vw, 48px); font-weight: 760; }
h2 { font-size: clamp(20px, 2.4vw, 26px); font-weight: 720; }
h3 { font-size: 18px; font-weight: 700; }

p { margin: 0; line-height: 1.55; }

.eyebrow {
  color: var(--terracotta-ink);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.muted { color: var(--muted); }
.muted.small { font-size: 12px; }

.lede {
  color: var(--cocoa-2);
  margin-top: 6px;
  max-width: 60ch;
}

.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr;
}

.topbar {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 24px;
  padding: max(22px, env(safe-area-inset-top)) max(28px, env(safe-area-inset-right)) 22px max(28px, env(safe-area-inset-left));
  position: sticky;
  top: 0;
  z-index: 30;
  background: linear-gradient(to bottom, rgba(251, 243, 232, 0.96), rgba(251, 243, 232, 0.85));
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  width: 36px; height: 36px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 30% 30%, #ffd194 0%, transparent 55%),
    linear-gradient(135deg, var(--terracotta) 0%, var(--amber) 100%);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4), 0 6px 18px rgba(192,115,79,0.35);
}

.brand-name { font-weight: 850; letter-spacing: -0.04em; font-size: 18px; }
.brand-sub { color: var(--muted); font-size: 12px; }

.nav {
  display: flex;
  gap: 6px;
  justify-self: center;
  background: rgba(255, 248, 236, 0.7);
  border: 1px solid var(--line);
  padding: 6px;
  border-radius: 999px;
  box-shadow: var(--shadow-soft);
}

.nav-item {
  border: 0;
  background: transparent;
  padding: 9px 16px;
  border-radius: 999px;
  color: var(--cocoa-2);
  font-weight: 700;
  letter-spacing: -0.01em;
  transition: background 160ms ease, color 160ms ease;
}

.nav-item:hover { background: var(--sand); }
.nav-item.active {
  background: var(--cocoa);
  color: var(--cream-2);
  box-shadow: 0 8px 22px rgba(58,42,34,0.3);
}

.coach-pill {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--line);
  background: linear-gradient(180deg, #fff8ec, #f5e3c5);
  padding: 10px 16px;
  border-radius: 999px;
  font-weight: 800;
  color: var(--terracotta-ink);
  box-shadow: var(--shadow-soft);
}

.coach-dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--moss);
  box-shadow: 0 0 0 4px rgba(124,140,91,0.18);
}

.app-main {
  padding: 28px;
  max-width: 1280px;
  margin: 0 auto;
  width: 100%;
}

.page {
  display: grid;
  gap: 24px;
}

.page-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 24px;
  margin-bottom: 4px;
}

.grid {
  display: grid;
  gap: var(--gap);
}

.grid-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stretch > * { min-height: 100%; }

@media (max-width: 980px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .topbar {
    grid-template-columns: 1fr auto;
    grid-template-areas:
      "brand  coach"
      "nav    nav";
    row-gap: 12px;
    padding: 16px 18px;
  }
  .brand { grid-area: brand; }
  .topbar-right { grid-area: coach; justify-self: end; }
  .nav { grid-area: nav; justify-self: stretch; justify-content: space-between; }
  .nav-item { padding: 8px 12px; font-size: 13px; }
  .app-main { padding: 18px; }
  .page-head { flex-direction: column; align-items: flex-start; }
  h1 { font-size: clamp(26px, 6vw, 36px); }
  .coach-drawer { right: 8px; left: 8px; width: auto; top: 70px; bottom: 8px; }
}

.card {
  background: rgba(255, 251, 244, 0.94);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 22px;
  box-shadow: var(--shadow);
}

.card.preview {
  cursor: pointer;
  transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}

.card.preview:hover {
  transform: translateY(-2px);
  border-color: #d6c4a4;
  box-shadow: 0 26px 70px rgba(80,50,30,0.16);
}

.warm-card {
  background:
    linear-gradient(140deg, rgba(247, 217, 182, 0.65), rgba(255, 251, 244, 0.92) 60%);
  border-color: #ecd5b1;
}

.preview-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}

.chev {
  font-size: 18px; color: var(--terracotta);
}

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.bullet {
  margin: 8px 0 12px;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 6px;
}

.bullet li {
  position: relative;
  padding-left: 18px;
  color: var(--cocoa-2);
}

.bullet li::before {
  content: "";
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--terracotta);
  position: absolute;
  left: 4px; top: 0.6em;
}

.quote {
  font-style: italic;
  color: var(--cocoa-2);
  border-left: 3px solid var(--amber);
  padding-left: 12px;
  margin: 6px 0 12px;
}

.stream {
  display: grid;
  gap: 10px;
  max-height: 360px;
  overflow-y: auto;
  padding-right: 4px;
}

.stream-item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 6px 12px;
  padding: 12px 14px;
  background: var(--cream-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
}

.stream-item .meta {
  color: var(--muted);
  font-size: 12px;
}

.stream-item .actions {
  display: flex; gap: 6px;
}

.stream-empty {
  color: var(--muted);
  font-size: 14px;
  padding: 12px 0;
}

.chip-row {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-top: 10px;
}

.chip {
  background: var(--cream-2);
  border: 1px solid var(--line);
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  color: var(--cocoa-2);
}

.tag {
  display: inline-block;
  background: var(--peach);
  color: var(--terracotta-ink);
  border-radius: 999px;
  padding: 3px 9px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.04em;
}

.tag.moss { background: #dde3c8; color: var(--moss-ink); }
.tag.amber { background: #f6dca6; color: #7c5410; }
.tag.ba { background: var(--peach); color: var(--terracotta-ink); }
.tag.ivex { background: #dde3c8; color: var(--moss-ink); }

.head-actions {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}

.seg {
  display: inline-flex;
  background: var(--cream-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px;
  margin-bottom: 8px;
  width: fit-content;
}

.seg-btn {
  border: 0;
  background: transparent;
  padding: 8px 16px;
  border-radius: 999px;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--cocoa-2);
}

.seg-btn.active[data-modality="ba"] {
  background: var(--terracotta);
  color: var(--cream-2);
  box-shadow: 0 8px 22px rgba(192, 115, 79, 0.32);
}

.seg-btn.active[data-modality="ivex"] {
  background: var(--moss);
  color: var(--cream-2);
  box-shadow: 0 8px 22px rgba(124, 140, 91, 0.32);
}

.legend {
  display: flex; flex-wrap: wrap; gap: 12px;
  font-size: 12px; color: var(--muted); align-items: center;
}

.legend-dot {
  width: 8px; height: 8px; border-radius: 50%;
  display: inline-block;
  margin-right: 4px;
}

.legend-dot.ba { background: var(--terracotta); }
.legend-dot.ivex { background: var(--moss); }
.legend-dot.done { background: var(--cocoa); }
.legend-dot.goal { background: var(--amber); }

.cal-cell .mark.ivex { background: var(--moss); }

.stream-item.ivex { border-left: 3px solid var(--moss); }

.mini-cal div.ba::after { background: var(--terracotta); }
.mini-cal div.ivex::after { background: var(--moss); }

.bubble.coach .source-pill {
  display: inline-block;
  margin-top: 6px;
  margin-right: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(192,115,79,0.14);
  color: var(--terracotta-ink);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.bubble.coach .source-pill.ivex {
  background: rgba(124,140,91,0.18);
  color: var(--moss-ink);
}

.primary, .ghost {
  border: 0;
  border-radius: 999px;
  padding: 11px 18px;
  font-weight: 800;
  letter-spacing: -0.01em;
  transition: transform 120ms ease, box-shadow 160ms ease, background 160ms ease;
}

.primary {
  background: var(--cocoa);
  color: var(--cream-2);
  box-shadow: 0 12px 26px rgba(58,42,34,0.22);
}

.primary:hover { transform: translateY(-1px); }

.ghost {
  background: rgba(255, 248, 236, 0.6);
  color: var(--cocoa);
  border: 1px solid var(--line);
}

.ghost:hover { background: var(--sand); }
.ghost.small { padding: 7px 12px; font-size: 13px; }

.form { display: grid; gap: 12px; }
.form label { display: grid; gap: 6px; font-weight: 700; color: var(--cocoa-2); }
.form input, .form select, .form textarea {
  background: var(--cream-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  width: 100%;
  font-weight: 500;
}

.form textarea { resize: vertical; min-height: 60px; }

.form .row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

@media (max-width: 720px) {
  .form .row { grid-template-columns: 1fr; }
}

/* Calendar */
.cal-controls {
  display: flex; align-items: center; gap: 8px;
}

.cal-label { font-weight: 800; letter-spacing: -0.02em; }

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.cal-cell {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: var(--radius-md);
  background: var(--cream-2);
  border: 1px solid var(--line);
  display: flex; flex-direction: column;
  padding: 6px 8px;
  font-size: 13px;
  color: var(--cocoa-2);
  cursor: pointer;
  transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
}

.cal-cell.dim { opacity: 0.45; }
.cal-cell.today { border-color: var(--terracotta); box-shadow: inset 0 0 0 1px var(--terracotta); }
.cal-cell.selected { background: var(--peach); border-color: var(--terracotta); }
.cal-cell:hover:not(.head) { transform: translateY(-1px); }

.cal-cell .num { font-weight: 800; }
.cal-cell .marks {
  margin-top: auto;
  display: flex; gap: 3px; flex-wrap: wrap;
}
.cal-cell .mark {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--terracotta);
}
.cal-cell .mark.done { background: var(--moss); }
.cal-cell .mark.goal { background: var(--amber); }

.cal-grid .head {
  aspect-ratio: auto;
  background: transparent;
  border: 0;
  cursor: default;
  text-align: center;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.12em;
  color: var(--muted);
  text-transform: uppercase;
}

.mini-cal {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin: 8px 0 12px;
}

.mini-cal div {
  aspect-ratio: 1/1;
  border-radius: 8px;
  background: var(--sand);
  position: relative;
}

.mini-cal div.has::after {
  content: "";
  position: absolute;
  inset: auto 4px 4px auto;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--terracotta);
}

.mini-cal div.has-ivex::before {
  content: "";
  position: absolute;
  inset: auto auto 4px 4px;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--moss);
}

.mini-cal div.today {
  outline: 2px solid var(--terracotta);
  outline-offset: -2px;
}

/* Coach drawer */
.coach-drawer {
  position: fixed;
  right: 22px; top: 84px; bottom: 22px;
  width: min(420px, 92vw);
  background: linear-gradient(180deg, #fff7e9, #fbeed8);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: 0 30px 80px rgba(80, 50, 30, 0.22);
  display: grid;
  grid-template-rows: auto 1fr auto auto auto;
  z-index: 50;
  overflow: hidden;
}

.coach-drawer[hidden] { display: none; }

.coach-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 18px 10px;
}

.coach-title { font-weight: 850; letter-spacing: -0.02em; font-size: 18px; }
.coach-sub { color: var(--muted); font-size: 12px; }

.coach-log {
  padding: 8px 18px;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 8px;
}

.bubble {

  padding: 10px 14px;

  line-height: 1.45;

}

.bubble.user {
  align-self: flex-end;
  background: var(--cocoa);
  color: var(--cream-2);
  border-bottom-right-radius: 6px;
}

.bubble.coach {
  align-self: flex-start;
  background: var(--cream-2);
  border: 1px solid var(--line);
  color: var(--cocoa);
  border-bottom-left-radius: 6px;
}

.bubble.system {
  align-self: center;
  background: rgba(124,140,91,0.18);
  color: var(--moss-ink);
  font-size: 12px;
  border-radius: 999px;
  padding: 4px 10px;
}

.coach-suggestions {
  display: flex; flex-wrap: wrap; gap: 6px;

}

.suggestion {
  background: var(--cream-2);
  border: 1px solid var(--line);
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  color: var(--cocoa-2);
}

.coach-form {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  padding: 10px 18px;
}

.coach-form textarea {

  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 12px;

}

.coach-foot-actions {

  gap: 6px;
  align-items: center;
}

.coach-foot-actions .ghost.small {
  padding: 6px 10px;
  font-size: 11px;
}

.stream-item.activation { border-left: 3px solid var(--terracotta); }

  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <div class="brand-name">Break Free</div>
          <div class="brand-sub">activation + exposure, gently</div>
        </div>
      </div>

      <nav class="nav" aria-label="Main">
        <button class="nav-item" data-route="home">Home</button>
        <button class="nav-item" data-route="calendar">Calendar</button>
        <button class="nav-item" data-route="create">Create</button>
        <button class="nav-item" data-route="help">Help</button>
      </nav>

      <div class="topbar-right">
        <button id="open-coach" class="coach-pill" aria-label="Open coach">
          <span class="coach-dot"></span> Coach
        </button>
      </div>
    </header>

    <main id="app" class="app-main" aria-live="polite"></main>

    <aside id="coach" class="coach-drawer" aria-label="Coach" hidden>
      <header class="coach-head">
        <div>
          <div class="coach-title">Coach</div>
          <div class="coach-sub" id="coach-sub">I learn you best through a short interview — say "interview me"</div>
        </div>
        <button id="close-coach" class="ghost" aria-label="Close coach">Close</button>
      </header>

      <div id="coach-log" class="coach-log" role="log" aria-live="polite"></div>

      <div class="coach-suggestions" id="coach-suggestions"></div>

      <form id="coach-form" class="coach-form">
        <textarea
          id="coach-input"
          rows="2"
          placeholder="Tell me what you noticed today, ask for an activation, or build an exposure step."
          aria-label="Talk to your coach"></textarea>
        <button class="primary" type="submit">Send</button>
      </form>

      <footer class="coach-foot">
        <span id="coach-stat">0 memories</span>
        <div class="coach-foot-actions">
          <button id="coach-interview" class="ghost small">Interview</button>
          <button id="coach-reset" class="ghost small">Forget recent</button>
        </div>
      </footer>
    </aside>
  </div>

  <template id="tpl-home">
    <section class="page page-home">
      <header class="page-head">
        <div>
          <div class="eyebrow">Today</div>
          <h1 id="home-greeting">Welcome back.</h1>
          <p class="lede" id="home-lede">A small, kind action counts. Choose any door below.</p>
        </div>
        <div class="head-actions">
          <button class="primary" data-action="quick-checkin">Quick check-in</button>
          <span class="muted small" id="home-modality-stat"></span>
        </div>
      </header>

      <div class="grid grid-3">
        <article class="card preview" data-route="calendar">
          <div class="preview-head">
            <span class="eyebrow">Calendar</span>
            <span class="chev">→</span>
          </div>
          <h2>This week at a glance</h2>
          <div id="home-calendar" class="mini-cal"></div>
          <div class="legend">
            <span class="legend-dot ba"></span> Activation
            <span class="legend-dot ivex"></span> Exposure
            <span class="legend-dot goal"></span> Goal
          </div>
        </article>

        <article class="card preview" data-route="create">
          <div class="preview-head">
            <span class="eyebrow">Create</span>
            <span class="chev">→</span>
          </div>
          <h2>Design a small step</h2>
          <ul class="bullet" id="home-create-tips">
            <li>Behavioral activation: small, valued action</li>
            <li>In-vivo exposure: graded approach to what's avoided</li>
            <li>Same form. Two paths. One kinder day.</li>
          </ul>
          <div class="muted" id="home-create-stat">No plans yet.</div>
        </article>

        <article class="card preview" data-route="help">
          <div class="preview-head">
            <span class="eyebrow">Help</span>
            <span class="chev">→</span>
          </div>
          <h2>If today feels heavy</h2>
          <p id="home-help-quote" class="quote">
            "Action precedes motivation. Approach precedes safety. Both can be small."
          </p>
          <div class="muted">Stuck? The Coach can sit with you.</div>

      </div>

      <section class="grid grid-2">
        <article class="card">

            <h3>Recent moves</h3>

          </div>

        <article class="card warm-card">
          <div class="card-head">
            <h3>From your Coach</h3>

          </div>
          <p id="home-coach-note" class="quote">I'm here. Tell me what you noticed today.</p>
          <div class="chip-row" id="home-coach-chips"></div>

  </template>

  <template id="tpl-calendar">
    <section class="page page-calendar">
      <header class="page-head">
        <div>
          <div class="eyebrow">Calendar</div>
          <h1>Your rhythm, gently</h1>
          <p class="lede">Activations and exposures, recent and upcoming. Tap a day to see, or add, a step.</p>
        </div>
        <div class="cal-controls">
          <button class="ghost" id="cal-prev" aria-label="Previous month">‹</button>
          <div id="cal-label" class="cal-label">Month</div>
          <button class="ghost" id="cal-next" aria-label="Next month">›</button>
        </div>
      </header>

      <div class="grid grid-2 stretch">
        <article class="card">
          <div id="cal-grid" class="cal-grid"></div>
          <div class="legend" style="margin-top: 12px">
            <span class="legend-dot ba"></span> Activation
            <span class="legend-dot ivex"></span> Exposure
            <span class="legend-dot done"></span> Done
            <span class="legend-dot goal"></span> Goal
          </div>
        </article>

        <article class="card">
          <div class="card-head">
            <h3 id="cal-day-title">Agenda</h3>
            <button class="ghost small" data-route="create">Add step</button>
          </div>
          <div id="cal-day-list" class="stream"></div>

          <div class="card-head" style="margin-top: 18px">
            <h3>Goals on the horizon</h3>
          </div>
          <div id="cal-goals" class="stream"></div>
        </article>
      </div>
    </section>
  </template>

  <template id="tpl-create">
    <section class="page page-create">
      <header class="page-head">
        <div>
          <div class="eyebrow">Create</div>
          <h1>Design a step</h1>
          <p class="lede">Pick a path. Behavioral activation rebuilds reward and value. In-vivo exposure rebuilds approach to what's avoided. Same form, different intent.</p>
        </div>
      </header>

      <div class="seg" role="tablist" aria-label="Modality">
        <button class="seg-btn active" data-modality="ba" role="tab">Behavioral Activation</button>
        <button class="seg-btn" data-modality="ivex" role="tab">In-Vivo Exposure</button>
      </div>

      <div class="grid grid-2 stretch">
        <article class="card">
          <form id="create-form" class="form">
            <input type="hidden" name="modality" value="ba" />

            <label>
              <span data-label-for="title" data-ba="What is the action?" data-ivex="What is the feared situation you'll approach?">What is the action?</span>
              <input name="title" required id="create-title"
                     data-ba="e.g. step outside for 5 minutes"
                     data-ivex="e.g. ride the bus three stops"
                     placeholder="e.g. step outside for 5 minutes" />
            </label>

            <label>
              <span data-label-for="value" data-ba="Why does it matter to you?" data-ivex="What does approaching this give back to you?">Why does it matter to you?</span>
              <input name="value"
                     data-ba="e.g. feeling connected to my body"
                     data-ivex="e.g. independence to travel on my own"
                     placeholder="e.g. feeling connected to my body" />
            </label>

            <div class="row">
              <label>
                <span>Category</span>
                <select name="category" id="create-category">
                  <option>Movement</option>
                  <option>Connection</option>
                  <option>Care</option>
                  <option>Pleasure</option>
                  <option>Mastery</option>
                  <option>Meaning</option>
                </select>
              </label>
              <label>
                <span data-label-for="energy" data-ba="Energy needed" data-ivex="Anticipated SUDS (0-100)">Energy needed</span>
                <select name="energy" id="create-energy">
                  <option value="1">1 — almost none</option>
                  <option value="2">2 — small</option>
                  <option value="3" selected>3 — moderate</option>
                  <option value="4">4 — meaningful</option>
                  <option value="5">5 — big</option>
                </select>
              </label>
            </div>

            <div class="row">
              <label>
                <span>When</span>
                <input name="when" type="datetime-local" />
              </label>
              <label>
                <span>Duration (min)</span>
                <input name="duration" type="number" min="1" max="240" value="15" />
              </label>
            </div>

            <label class="ivex-only" hidden>
              <span>Safety behavior to drop (optional)</span>
              <input name="safety" placeholder="e.g. checking my phone, leaving early" />
            </label>

            <label>
              <span>Tied to a goal (optional)</span>
              <select name="goalId" id="create-goal-select"><option value="">—</option></select>
            </label>

            <label>
              <span>A kind note to your future self</span>
              <textarea name="notes" rows="2"
                        data-ba="It's okay if it's small. You're showing up."
                        data-ivex="Approach. Stay long enough to learn something new."
                        placeholder="It's okay if it's small. You're showing up."></textarea>
            </label>

            <div class="row">
              <button class="primary" type="submit" id="create-submit">Save activation</button>
              <button class="ghost" type="button" id="create-add-goal">+ Add a goal</button>
            </div>
          </form>
        </article>

        <article class="card">
          <div class="card-head">
            <h3>Your plans</h3>
            <span class="muted" id="create-count">0 saved</span>
          </div>
          <div id="create-list" class="stream"></div>

          <div class="card-head" style="margin-top: 18px">
            <h3>Your goals</h3>
          </div>
          <div id="create-goals" class="stream"></div>
        </article>
      </div>
    </section>
  </template>

  <template id="tpl-help">
    <section class="page page-help">
      <header class="page-head">
        <div>
          <div class="eyebrow">Help</div>
          <h1>Two paths, one kindness</h1>
          <p class="lede">Behavioral activation and in-vivo exposure work different angles of the same problem: a life that's gotten smaller. Pick what fits where you are.</p>
        </div>
      </header>

      <div class="grid grid-2">
        <article class="card warm-card">
          <span class="tag ba">Behavioral Activation</span>
          <h2 style="margin-top:8px">Rebuild contact with what matters</h2>
          <p>Action precedes motivation. You schedule small, valued activities and do them regardless of mood. Mood follows the doing.</p>
          <ul class="bullet">
            <li>Pick activities tied to a value you care about</li>
            <li>Start small — energy 1 or 2 is real</li>
            <li>Track mood before and after, not just thoughts</li>
            <li>Repeat. Pattern beats intensity.</li>
          </ul>
        </article>

        <article class="card warm-card">
          <span class="tag ivex">In-Vivo Exposure</span>
          <h2 style="margin-top:8px">Approach what's been avoided</h2>
          <p>Anxiety shrinks a life by pruning approach. Graded exposure widens it again — gradually, deliberately, and long enough to learn something new.</p>
          <ul class="bullet">
            <li>Build a hierarchy from easiest to hardest (SUDS 0-100)</li>
            <li>Approach the next step, not the top step</li>
            <li>Stay until learning happens, not just until relief</li>
            <li>Drop one safety behavior at a time</li>
          </ul>
        </article>
      </div>

      <div class="grid grid-3">
        <article class="card">
          <h3>If energy is low</h3>
          <ul class="bullet">
            <li>Shrink the action by half</li>
            <li>Do it sitting, slow, or with music</li>
            <li>Promise yourself only the first minute</li>
          </ul>
          <button class="ghost small" data-help="low-energy">Walk me through it</button>
        </article>

        <article class="card">
          <h3>If avoidance is loud</h3>
          <ul class="bullet">
            <li>Name what you're moving away from</li>
            <li>Pick a SUDS 30-40 step from your hierarchy</li>
            <li>Stay 5 extra minutes past the urge to leave</li>
          </ul>
          <button class="ghost small" data-help="avoidance">Walk me through it</button>
        </article>

        <article class="card">
          <h3>If it didn't help</h3>
          <ul class="bullet">
            <li>Rate honestly — that's data, not failure</li>
            <li>Try a different category or smaller step</li>
            <li>Ask the Coach what your data is showing</li>
          </ul>
          <button class="ghost small" data-help="didnt-help">Walk me through it</button>
        </article>
      </div>

      <article class="card warm-card">
        <h3>Patterns we're noticing</h3>
        <div id="help-patterns" class="stream"></div>
        <p class="muted small">Patterns are clues, not verdicts.</p>
      </article>

      <article class="card">
        <h3>Sources</h3>
        <p class="muted small">The Coach indexes these clinical workbooks for context.</p>
        <ul class="bullet" id="help-sources"></ul>
      </article>
    </section>
  </template>

 Activation for Depression", "i": 4, "text": "to find strategies\nto help her motivation by practicing awareness of different avoidance patterns\nand developing alternative, adaptive behaviors.\n5.2\n\nBehavioral Activation is based on the well-researched understanding that\ndepression often keeps us from doing the things that bring enjoyment and\nmeaning to our lives. This \"downward spiral\" (explained in the first chapter of\nthis manual) causes us to feel even worse. In Behavioral Activation we work to\nreverse this cycle using our actions and choices.\nBehavioral Activation involves:\n• Understanding the \"vicious cycles\" of\ndepression\n• Monitoring our daily activities\n• Identification of goals and values\n• Building an upward spiral of motivation and\nenergy through pleasure and mastery\n• Activity Scheduling: purposefully scheduling\nin enjoyable and meaningful activities\n• Problem solving around potential barriers to\nactivation\n• Reducing avo", "topics": ["activation", "behavioral", "motivation", "understanding", "depression", "spiral", "activities", "scheduling"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 5, "text": "ty Scheduling: purposefully scheduling\nin enjoyable and meaningful activities\n• Problem solving around potential barriers to\nactivation\n• Reducing avoidance\n• Working as a team to make gradual,\nsystematic, sustained progress. Change\ndoesn't happen over night!\n• Using between-session assignments. Practice\nchanges the brain, little by little!\n\"But my depression is 'situational!'\"\nYes, it is true that often depression is set in motion by difficult events that happen to us. If you are\ndealing with a big loss, stressful situation, or change in your life, feelings of depression could be a\nresult. While it is important to address these external events and sometimes to talk about the past, it\nis also important to find ways to address our current situation, find ways to fulfill on our future life\naims, and find time for enjoyment. Behavioral Activation can help with this part of treatment.\n5.3", "topics": ["depression", "find", "scheduling", "activation", "change", "happen", "little", "events"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 6, "text": "situation, find ways to fulfill on our future life\naims, and find time for enjoyment. Behavioral Activation can help with this part of treatment.\n5.3\n\nOn the next few pages we\nillustrate the \"vicious cycles\" of\ndepression, according to the\nresearch on depression and\nBehavioral Activation.\nNote: Behavioral Activation has\nbeen shown in research studies to\nbe effective on its own for some\npeople to overcome depression.\nHowever, it is often used alongside\nother therapeutic skills, as it may\nnot address your specific situation\nall by itself. Consider it just one of\nmany options in your effort to\nmanage depression.\nAction precedes emotion!?\nWe often wait to feel better or more motivated before\ndoing something.\nRemember that anxiety and depression come from\nparts of our brain that are really trying to protect us by\ngetting us to avoid or isolate.", "topics": ["depression", "behavioral", "activation", "situation", "find", "research", "often", "ways"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 7, "text": "g something.\nRemember that anxiety and depression come from\nparts of our brain that are really trying to protect us by\ngetting us to avoid or isolate. This means that as long\nas we are following the lead of the anxiety and\ndepression, we will continue to feel less motivated and\nwant to avoid and isolate.\nSo, when we are feeling anxious and depressed,\nwe cannot wait on the brain to give us the\nmotivation to get out there and do things.\nResearch has shown that our decision to activate (in\nother words, to do the opposite of what the\ndepression wants us to do, and do something in\nline with our values and goals) is necessary for\nemotions to change.\nSo why activate first? Firstly, activating changes our brain state and can make us\nfeel better, right away. For example, exercise can produce \"good chemicals\" in\nthe brain that lift mood while they are in the bloodstream.", "topics": ["brain", "depression", "something", "anxiety", "avoid", "isolate", "feel", "activate"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 8, "text": "can make us\nfeel better, right away. For example, exercise can produce \"good chemicals\" in\nthe brain that lift mood while they are in the bloodstream. Secondly, the more\nthat we activate, the more situations we find ourselves in that can give us positive\nexperiences. The technical term for this is \"reinforcing positive context\ncontingencies.\" Technicalities aside, we need to \"get out there\" and give\nourselves the best chance of feeling better, even if we don't feel like it at the\ntime.\n5.4", "topics": ["feel", "better", "ourselves", "give", "positive", "make", "right", "away"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 9, "text": "Technicalities aside, we need to \"get out there\" and give\nourselves the best chance of feeling better, even if we don't feel like it at the\ntime.\n5.4\n\nWhat happened\n(stressful life events, triggers from past, etc.)\n\"I lost my job\"\n\"We had our first child\"\nHow you feel\n(emotions)\nSad\nAnxious\nStressed\nShut down\nEmbarrassed\nWhat you do\n(or don't do)\nStay in bed\nDon't engage with family\nDon't return calls or texts\nAvoid people\nFIRST\nVICIOUS\nCYCLE\nEvents often get\nthe depression\n\"ball rolling.\"\nThis could be\nsomething new\nor a reminder\nfrom a past\nstressful event.\nThe stress of\nevents leads to\nnegative\nemotions that\nare distressing\nand make us\nwant to draw\nback.\nEmotions lead\nto behaviors: we\navoid or isolate,\nwhich makes us\nfeel worse.\n5.5", "topics": ["don't", "feel", "events", "emotions", "get", "stressful", "past", "first"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 10, "text": "negative\nemotions that\nare distressing\nand make us\nwant to draw\nback.\nEmotions lead\nto behaviors: we\navoid or isolate,\nwhich makes us\nfeel worse.\n5.5\n\nWhat happened\n(life events, triggers, etc.)\n\"I lost my job\"\n\"We had our first child\"\n* Increased odds of more hardships and negative life events\nMy friends stop calling me because I never return calls or texts\nHow you feel\n(emotions)\nSad\nAnxious\nStressed\nShut down\nEmbarrassed\nWhat you do\n(or don't do)\nStay in bed\nDon't engage with family\nDon't return calls or texts\nAvoid people\nFIRST\nVICIOUS\nCYCLE\nSECOND\nVICIOUS\nCYCLE\nAvoidance,\nisolation, and\nother behaviors\ncause further\nnegative events,\nmaking us feel\neven more\ndepressed.\n5.6\n\nWhat happened\n(life events, triggers, etc.)\nHow you feel\n(symptoms)\nWhat you do\n(or don't do)\nTry to determine your own \"vicious cycles,\" identifying specific events, emotions, and responses.\n5.7", "topics": ["events", "emotions", "feel", "don't", "negative", "life", "vicious", "behaviors"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 11, "text": "w you feel\n(symptoms)\nWhat you do\n(or don't do)\nTry to determine your own \"vicious cycles,\" identifying specific events, emotions, and responses.\n5.7\n\nWith BA, we rate mood on a scale of 0-10, 10\nbeing the best, 0 being the worst. We ask\npeople to rate mood in each hour to the best\nof their ability in order to understand mood\nchanges.\nFor example:\nMonday:!\n8am: Woke up (5)!\n9am: Went to go eat breakfast (6)!\n10am: Got to work, talked to Bob (5)!\n11am:Sitting at my desk reading e-mails (3)!\n12pm:Eating lunch at my desk, worrying\nabout meeting (3)!\n1pm:Meeting, thinking about issue with\nreports that I missed, tired (3)!\n2pm: Sitting at my desk working (4)!\n3pm: Working (4)!\n4pm: Working (4)!\n5pm: Driving home (6)!\nBeing aware of our mood,\nemotions, and behaviors is an\nimportant part of CBT.", "topics": ["mood", "desk", "working", "emotions", "rate", "best", "sitting", "meeting"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 12, "text": "working (4)!\n3pm: Working (4)!\n4pm: Working (4)!\n5pm: Driving home (6)!\nBeing aware of our mood,\nemotions, and behaviors is an\nimportant part of CBT. In order to\nknow what to do to fix a problem,\nwe first need to understand what is\ngoing on!\nActivity Monitoring is the first step\nof Behavioral Activation. It is\nimportant to know exactly what we\nare doing throughout the day, and\nhow this corresponds to our mood.\nWhile we can't fix the depression\njust by noticing this, we can take a\nstep toward feeling better by\nunderstanding which behaviors\nhelp us feel better, which continue\nto maintain the depression as it is,\nand which make us feel worse.\nUse the Activity Monitoring Chart\non the next page to start tracking\nyour activities and mood.\n Get out that pen and paper!\nResearch shows that people who\nwrite things down as part of CBT\npractice do better than those that try\nto do it all in their he", "topics": ["working", "mood", "better", "behaviors", "important", "part", "cbt", "know"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 13, "text": "ut that pen and paper!\nResearch shows that people who\nwrite things down as part of CBT\npractice do better than those that try\nto do it all in their heads. While it\ndoes involve more work (and may\nseem like going back to school), we\nhope you will give it a try at first, until\nthe skills become more natural.\n5.8\n\n Sun Mon Tues Wed Thurs Fr Sat\n5-7:00am\n __________________________________________________________________________________________________________\n7:00 am\n __________________________________________________________________________________________________________\n8:00 am\n __________________________________________________________________________________________________________\n9:00 am\n __________________________________________________________________________________________________________\n10:00 am\n _________________________________________________________________________________", "topics": ["try", "pen", "paper", "research", "shows", "people", "write", "things"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 14, "text": "__________________________________________________________\n10:00 am\n __________________________________________________________________________________________________________\n11:00 am\n __________________________________________________________________________________________________________\n12:00 pm\n __________________________________________________________________________________________________________\n1:00 pm\n __________________________________________________________________________________________________________\n2:00 pm\n __________________________________________________________________________________________________________\n3:00 pm\n __________________________________________________________________________________________________________\n4:00 pm\n __________________________________________________________________________________________________________\n5:00 pm\n _________________", "topics": []}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 15, "text": "_______\n4:00 pm\n __________________________________________________________________________________________________________\n5:00 pm\n __________________________________________________________________________________________________________\n6:00 pm\n __________________________________________________________________________________________________________\n7:00 pm\n __________________________________________________________________________________________________________\n8:00 pm\n __________________________________________________________________________________________________________\n9:00 pm\n __________________________________________________________________________________________________________\n10:00 pm\n __________________________________________________________________________________________________________\n11:00 pm\n _____________________________________________________________________", "topics": []}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 16, "text": "______________________________________________________________________\n11:00 pm\n __________________________________________________________________________________________________________\nInstructions: Record your activity for each hour of the day (what you were doing, with whom,\nwhere, etc.). Record a rating for your mood as you were doing each activity. Mood is rated\nbetween 0-10, with \"0\" indicating \"low mood\" and \"10\" indicating \"good mood.\"\n5.9", "topics": ["mood", "record", "activity", "indicating", "instructions", "hour", "day", "whom"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 17, "text": "rating for your mood as you were doing each activity. Mood is rated\nbetween 0-10, with \"0\" indicating \"low mood\" and \"10\" indicating \"good mood.\"\n5.9\n\n_________________________________________________________________________________________________________________\n_________________________________________________________________________________________________________________\n_________________________________________________________________________________________________________________\n_________________________________________________________________________________________________________________\n_________________________________________________________________________________________________________________\n_________________________________________________________________________________________________________________\n_________________________________________________________________", "topics": ["mood", "indicating", "rating", "activity", "rated", "between", "low", "good"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 18, "text": "____________________________________________________________________________________\n_________________________________________________________________________________________________________________\n_________________________________________________________________________________________________________________\n_________________________________________________________________________________________________________________\n_________________________________________________________________________________________________________________\n_________________________________________________________________________________________________________________\n_________________________________________________________________________________________________________________\n_________________________________________________________________________________________________________________\n_________________", "topics": []}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 19, "text": "__________________\n_________________________________________________________________________________________________________________\n_________________________________________________________________________________________________________________\n_________________________________________________________________________________________________________________\nAntidepressant/UP Activities Depressant/DOWN Activities\nBased on the mood ratings you recorded on the Activity Monitoring Worksheet, determine which\nactivities helped you to feel more positive (\"UP\" activities) and which led to feeling down\n(\"DOWN\" activities).\nIn Behavioral Activation, one of our aims is to increase \"UP\" activities and decrease \"DOWN\"\nactivities. Over the next section we will learn more about the types of activities that will lead to\nbetter mood, to add to the list above.", "topics": ["activities", "mood", "will", "antidepressant", "depressant", "based", "ratings", "recorded"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 20, "text": "ase \"DOWN\"\nactivities. Over the next section we will learn more about the types of activities that will lead to\nbetter mood, to add to the list above. Over time, we can replace the \"DOWN\" activities with\nmore \"UP\" ones.\n5.10\n\nA Life Worth Living: Values, Pleasure, Mastery, and Goals\nThe next step in Behavioral Activation is determining the behaviors on which to\nfocus to improve our mood. While some behaviors, like exercise and meditation,\ncan be used right away to improve mood directly, many of the behaviors that are\nlikely to help us are those that align with the things that we enjoy or are\nimportant to us.\nAn exploration of \"values,\" \"pleasure,\" and \"mastery\" describe much of the\n\"stuff\" that makes life worth living.", "topics": ["activities", "mood", "behaviors", "next", "will", "life", "worth", "living"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 21, "text": "that we enjoy or are\nimportant to us.\nAn exploration of \"values,\" \"pleasure,\" and \"mastery\" describe much of the\n\"stuff\" that makes life worth living. This process can help us come up with\ntangible goals to move us toward the things that are most important to us.\nGoals and objectives outline the steps we take to experience our lives more\nfully. They give us targets to help us experience more pleasure, mastery, and\nvalue-driven behavior.\n\"Values\" are what we find meaningful in life. They\nare the most important things to us. Everyone has\ndifferent values, and for each of us they can\nchange over time. They are like a compass,\npointing us in the direction we want to go.\n\"Pleasure\" involves activities, or \"play\" that we enjoy for the sake\nof the activity itself.", "topics": ["important", "values", "pleasure", "enjoy", "mastery", "life", "help", "goals"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 22, "text": "ke a compass,\npointing us in the direction we want to go.\n\"Pleasure\" involves activities, or \"play\" that we enjoy for the sake\nof the activity itself. Hobbies, games, spending time in nature, or\nspending time with a good friend.\n\"Mastery\" involves activities, such as work or sports, that\ninvolve the development of skills; we are able to\naccomplish things and feel a sense of mastery over our\nenvironment. When enjoyed in moderation and\ndiversified well with other activities, they can increase\npositive emotions and improve how we feel about\nourselves. Also, we may feel more creative as we learn to\nmaster certain skills, adding to the possibilities of\nenjoyment.\nTo feel more consistently engaged and happy in the world, it is usually best to\nfind a balance of goals centered on values, pleasure, and mastery. How that\nbalance looks for you will be unique.", "topics": ["feel", "activities", "mastery", "pleasure", "involves", "spending", "time", "skills"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 23, "text": "in the world, it is usually best to\nfind a balance of goals centered on values, pleasure, and mastery. How that\nbalance looks for you will be unique. On the following pages, we will help you\nunderstand how this balance might look for your own life.\n5.11\n\nAs we mentioned earlier, \"values\" are what we find\nmeaningful and important. These can be different for\ndifferent people.\nValues are important to explore, because much of our\ngoal-directed activity comes from a foundation of what\nis valued. For example, one may value a healthy\nlifestyle, and a related goal may be to exercise daily.\nWe may value family, and therefore choose to\nschedule in time with them. Or if we don't have a\nfamily, our activities could lead to getting married and\nstarting one.\nIt is common to mistake certain wishes and feelings for\nvalues.", "topics": ["values", "balance", "may", "find", "will", "important", "different", "one"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 24, "text": "we don't have a\nfamily, our activities could lead to getting married and\nstarting one.\nIt is common to mistake certain wishes and feelings for\nvalues. Values are not internal states, how people treat\nus, or specific things to achieve.\nBelow are some of the common areas of life that\npeople value and may lead to goal-directed activity.\nIntimate relationships\nWhat kind of partner do you\nwant to be? What quality of\nrelationship do you want to be\npart of? How do you want to\nspend time together?\nMental/Emotional Health\nWhat helps you maintain\nsound mental health? Why is\nthis important to you? What\nissues would you like to\naddress?\nFriendships/\nsocial relations\nWhat sort of friend do you want\nto be? How would you like to\nact towards your friends? How\ncan these relationships be\nimproved?\nEmployment/career\nWhat kind of work is valuable to\nyou? What qualities do you\nwant to bring as an employee?\nW", "topics": ["want", "lead", "common", "values", "people", "relationships", "kind", "mental"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 25, "text": "How\ncan these relationships be\nimproved?\nEmployment/career\nWhat kind of work is valuable to\nyou? What qualities do you\nwant to bring as an employee?\nWhat kind of work relationships\nwould you like to build?\nEducation/training/\npersonal growth\nHow would you like to grow?\nWhat kind of skills would you\nlike to develop? What would\nyou like to know more about?\nHobbies/ Recreation\nHow would you like to enjoy\nyourself? What relaxes you?\nWhen are you most playful? Are\nthere any special interests you\nwould like to pursue?\nSpirituality\nWhat kind of relationship do\nyou want with God/nature/ the\nEarth/mankind? What does\nhaving a spiritual life mean to\nyou? How can you exercise this?\nCitizenship/Community\nWhat kind of environment\ndo you want to be a part of?\nHow do you want to contribute to your community?\nPhysical well-being\nWhat kind of values do you\nhave regarding your physical\nwellbeing? How do yo", "topics": ["kind", "like", "want", "relationships", "work", "community", "physical", "improved"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 26, "text": "of?\nHow do you want to contribute to your community?\nPhysical well-being\nWhat kind of values do you\nhave regarding your physical\nwellbeing? How do you want\nto look at yourself?\nFamily relationships\nWhat kind of relationships do you\nwant with your family? What kind of\nmother/father/ brother/sister/uncle/\naunt do you want to be? What is\nimportant to you about a good\nfamily?\nOn the next page is a list of values\nthat are related to the categories\nbelow. Use them to start listing your\nown values on the following page.\n5.12", "topics": ["want", "kind", "values", "family", "physical", "relationships", "page", "contribute"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 27, "text": "On the next page is a list of values\nthat are related to the categories\nbelow. Use them to start listing your\nown values on the following page.\n5.12\n\nFamily relations\n• Work on current relationships\n• Spend time with family\n• Take an active role in raising my children\n• Maintain consistent healthy\n communication\nMarriage/couples/intimate relationships\n• Establish a sense of safety and trust\n• Give and receive affection\n• Spend quality time with my partner\n• Show my partner how much I\n appreciate them\nFriendships/Social Relationships\n• End destructive relationships\n• Reach out for new relationships\n• Feel a sense of belonging\n• Have and keep close friends\n• Spend time with friends\n• Have people to do things with\nMental/Emotional health\n• Seek fun and things that give me\n pleasure\n• Have free time\n• Be independent and take care of myself\n• Challenge my negative thinking\n• Make my own deci", "topics": ["relationships", "time", "spend", "page", "values", "own", "family", "take"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 28, "text": "ek fun and things that give me\n pleasure\n• Have free time\n• Be independent and take care of myself\n• Challenge my negative thinking\n• Make my own decisions\n• Engage in therapy\n• Take my medications\n• Stay active\nPhysical well-being\n• Live in secure and safe surroundings\n• Engage in regular exercise\n• Have a steady income to meet physical\n needs\n• Eat foods that are nourishing to my\n body\n• Maintain a balance between rest and\n activity\n• Get enough sleep\nCitizenship/Community\n• Contribute to the larger community\n• Help people in need\n• Improve society\n• Be committed to a cause or group that\n has a larger purpose\n• Make sacrifices for others\nSpirituality\n• Follow traditions and customs\n• Live according to spiritual principles\n• Practice my religion or faith\n• Grow in understanding myself, my\n personal calling, and life's purpose\n• Discern the will of God\n• Find meaning in life\n• Develop a", "topics": ["take", "myself", "make", "engage", "physical", "live", "community", "larger"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 29, "text": "ligion or faith\n• Grow in understanding myself, my\n personal calling, and life's purpose\n• Discern the will of God\n• Find meaning in life\n• Develop a personal philosophy of life\n• Spend time in nature\n• Focus on the greater good\nEducation/Training/Personal Growth\n• Be involved in undertakings I believe\n personally are significant\n• Try new and different things in life\n• Learn new things\n• Be daring and seek adventure\n• Have an exciting life\n• Learn to do challenging things that help\n me grow as a person\nEmployment\n• Be powerful and able to influence\n others, have authority\n• Make important decisions that affect the\n organization\n• Be a leader\n• Make a great deal of money\n• Be respected by others\n• Be seen by others as successful, be\n ambitious\n• Become well-known, obtain recognition\n and status\n• Be productive, work hard\n• Achieve significant goals\n• Enjoy the work I do\n• Do what I'm tol", "topics": ["life", "personal", "things", "others", "grow", "significant", "new", "learn"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 30, "text": "ous\n• Become well-known, obtain recognition\n and status\n• Be productive, work hard\n• Achieve significant goals\n• Enjoy the work I do\n• Do what I'm told and follow the rules\nBelow is a list of general value categories, and some specific values that are common in each. See\nif any of them fit you, and use this page to fill out the values rating sheet on the next page.\nValues, con.\n5.13\n\nHere are some other experiments to explore your own values:\n1. Imagine that an important newscaster were doing a biographical story on your life.\nThink about how you'd want them to describe you. How would they describe the way\nyou spent your time? How you related to others? What was most important to you?\nWhat are your strengths as a person? Write down a narrative of what they would say.\n2. Imagine you could read the mind of a person that's important to you and with whom\nyou've had a good relationship.", "topics": ["values", "important", "work", "page", "imagine", "describe", "person", "ous"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 31, "text": "narrative of what they would say.\n2. Imagine you could read the mind of a person that's important to you and with whom\nyou've had a good relationship. They are thinking all kinds of thoughts about your\nqualities: what you stand for, what your strengths are, what you mean to him or her, and\nthe role you play in his or her life.\n3. Think about your heroes. They can be people directly in your life, or other people that\nyou look up to, even fictional characters. What are their qualities? What do you admire\nabout them?\n4. Imagine you are writing your own autobiography. Imagine how you would like to live\nyour life, barring all barriers, in the \"best case scenario.\" What are the things that are\nmost important to you in this scenario? What would you stand for? How would you\nspend your time?\n5. Imagine that someone is performing the eulogy at your funeral.", "topics": ["imagine", "life", "important", "qualities", "stand", "people", "scenario", "narrative"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 32, "text": "nt to you in this scenario? What would you stand for? How would you\nspend your time?\n5. Imagine that someone is performing the eulogy at your funeral. Looking back on your\nlife, they would be commenting on your strengths, values, and achievements. How\nwould you want them to describe your life?\n6. If you are struggling to find a valued direction, commit to experimenting with some of\nthe values on the previous pages for just one week. After choosing a value, plan to\nnotice your reactions to making the effort to hold to this value. Make a list of behaviors\nthat might fit with the value and choose one behavior to try. Notice your judgments\nthat come up about choosing this behavior. Then make a plan to fulfill on the valuedriven behavior. Just do the behavior without telling anyone about it and see what\nhappens.", "topics": ["behavior", "value", "life", "values", "one", "choosing", "plan", "notice"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 33, "text": "ing this behavior. Then make a plan to fulfill on the valuedriven behavior. Just do the behavior without telling anyone about it and see what\nhappens. Commit to following through on this behavior once per day for one week.\nKeep a diary of your reactions to behaving this way and others' reactions to you. At the\nend of the week, reflect on your experiment with someone else, like a therapist or\ngroup leader.\nValues, con.\n5.14\n\nBased on your exploration of the previous pages, write a summary of your values.", "topics": ["behavior", "week", "reactions", "values", "ing", "make", "plan", "fulfill"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 34, "text": "th someone else, like a therapist or\ngroup leader.\nValues, con.\n5.14\n\nBased on your exploration of the previous pages, write a summary of your values. For example,\n\"to live a healthy life and take care of my body\" (physical well-being), or \"to be a good friend\nto people who need me, and to enjoy time with people I love\"(friendships).\nRate each domain for how important it is to you from 0-10 (0 = not important, 10 = extremely\nimportant).\nRemember: values are not internal states, how people treat us, or specific things to achieve.\nValues Rating Sheet\nPhysical well-being\nCitizenship/Community\nSpirituality\nFamily relationships Intimate Relationships\nMental/Emotional Health\nFriendships/social relations\nEmployment/career Education/training/\npersonal growth\nHobbies/Recreation\nOther?\n5.15", "topics": ["values", "people", "important", "physical", "well-being", "friendships", "relationships", "someone"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 35, "text": "lationships\nMental/Emotional Health\nFriendships/social relations\nEmployment/career Education/training/\npersonal growth\nHobbies/Recreation\nOther?\n5.15\n\nThe next step is to translate our values into activities that help us fulfill on those goals.\nTake a moment to think about the values that you identified on the previous page. What are\nsome short term goals in each area? What are some long term goals? Use this page and the\nnext to start to brainstorm. Write down your results on the upcoming page: \"Values, Pleasure,\nand Mastery Master List.\"\nParenting\nI want to be involved in my\nchildren's interests and\nlearning. I'd like to build special\nmemories with my kids and\nspend quality time with them.\nI'm going to attend the\nnext PTO meeting and\nmaybe contact the\nteacher to be a\nclassroom volunteer.", "topics": ["next", "values", "goals", "page", "term", "lationships", "mental", "emotional"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 36, "text": "ies with my kids and\nspend quality time with them.\nI'm going to attend the\nnext PTO meeting and\nmaybe contact the\nteacher to be a\nclassroom volunteer. I\ncan plan a small vacation\nto take with the kids\nnext summer.\nVALUE ACTIVITIES\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\nExample:\n5.16", "topics": ["kids", "next", "ies", "spend", "quality", "time", "i'm", "going"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 37, "text": "_________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\nExample:\n5.16\n\nVALUE ACTIVITIES\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n5.17", "topics": ["example", "value", "activities"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 38, "text": "_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n_________________\n5.17\n\nPleasure\nHobbies, Interests, and other \"play\"\n•  Reading\n•  TV, movies, plays\n•  Dancing\n•  Playing or listening to\n music\n•  Board games or cards\n•  Arts and crafts, sewing, painting\n•  Cooking\n•  Walking, hiking, enjoying nature,\n fishing\n•  Sports (basketball, softball,\n swimming, etc.) or going as a\n spectator\n•  Martial arts (karate, etc.)\n•  Museums/zoos\n•  Video games\n•  Traveling, sightseeing, going\n to the beach, sunbathing\n•  Shopping\n•  Gardening/decorating\n•  Photography\n•  Comedy: TV, recordings, live\n•  Religion or spirituality\nSocial activities\n•  Spending time with family\n•  Enjoying own children and/or young\n relatives\n•  Enjoying close friends\n•  Hanging out with large\n groups of friends/acquaintances\n•  Parties, meeting", "topics": ["enjoying", "games", "arts", "etc", "going", "friends", "pleasure", "hobbies"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 39, "text": "njoying own children and/or young\n relatives\n•  Enjoying close friends\n•  Hanging out with large\n groups of friends/acquaintances\n•  Parties, meeting new people\n•  Romance\n•  Pets\n•  Clubs: meeting people with similar\n interests\n•  Enjoying food and drink with others\nPleasure involves activities that we enjoy for the sake of the activity itself. There are many different\nkinds of pleasure. Those that are most sustainable involve \"play\" such as hobbies and other\nrecreational activities. Social activities can also involve pleasure. Other types of pleasure, such as\nsensory experiences (food, drink, images, touch, etc.) can also be enjoyable if done in moderation.\nBelow are examples of enjoyable activities that are enjoyed by many.", "topics": ["pleasure", "activities", "enjoying", "friends", "meeting", "people", "food", "drink"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 40, "text": "s (food, drink, images, touch, etc.) can also be enjoyable if done in moderation.\nBelow are examples of enjoyable activities that are enjoyed by many. Circle the ones that apply to you,\nand add others that aren't included below.\nSensory experiences\n•  Pleasant smells, images, sounds,\n physical touch, tastes\n•  Taking a bath\n•  Listening to soothing music\n•  Mindful tasting\nOther?\n____________________________________________\n_____________________________________________\n_____________________________________________\n5.18\n\nMastery\nMastery involves activities, such as work or sports, that involve the development of\nskills; we are able to accomplish things and feel a sense of mastery over our\nenvironment.", "topics": ["mastery", "images", "touch", "enjoyable", "below", "activities", "food", "drink"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 41, "text": "es, such as work or sports, that involve the development of\nskills; we are able to accomplish things and feel a sense of mastery over our\nenvironment. When enjoyed in moderation and diversified well with other activities,\nthey can increase positive emotions and improve how we feel about ourselves.\nHere are some examples of how people experience mastery to experience fulfillment\nin their lives. Circle the ones that apply to you, and add others that aren't included\nbelow.\nJob or Meaningful Daytime Activity\nLook for or attempt to develop some of these\nqualities in your occupation volunteer work, or\nother meaningful daytime activity:\n•  Enjoyment\n•  Creativity\n•  Feelings of competence (able to\n accomplish tasks satisfactorily)\n•  Potential for development of skills\n•  Ability to \"move up\" in the organization or\n take on more responsibility, if this is\n desired\n•  Social contact with coworke", "topics": ["work", "development", "skills", "able", "accomplish", "feel", "mastery", "experience"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "b ating\n29. Thinking how it will be when I finish school\n30. Getting out of debt/paying debts\n31. Practicing karate, judo, yoga\n32.", "topics": ["going", "planning", "thinking", "career", "collecting", "etc", "listening", "day's"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 44, "text": "doing aerobics\n28. Eating\n29. Thinking how it will be when I finish school\n30. Getting out of debt/paying debts\n31. Practicing karate, judo, yoga\n32. Thinking about retirement\n33. Repairing things around the house\n34. Working on my car (bicycle)\n35. Remembering the words and deeds of\nloving people\n36. Wearing sexy clothes\n37. Having quiet evenings\n38. Taking care of my plants\n39. Buying, selling stocks and shares\n40. Going swimming\n41. Doodling\n42. Exercising\n43. Collecting old things\n44. Going to a party\n45. Thinking about buying things\n46. Playing golf\n47. Playing soccer\n48. Flying kites\n49. Having discussions with friends\n50. Having family get-togethers\n51. Riding a motorbike\n52. Sex\n53. Playing squash\n54. Going camping\n55. Singing around the house\n56. Arranging flowers\n57. Going to church, praying (practicing\nreligion)\n58. Losing weight\n59. Going to the beach\n60.", "topics": ["going", "thinking", "things", "having", "playing", "practicing", "around", "house"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 45, "text": "ing\n55. Singing around the house\n56. Arranging flowers\n57. Going to church, praying (practicing\nreligion)\n58. Losing weight\n59. Going to the beach\n60. Thinking I'm an OK person\n61. A day with nothing to do\n62. Having class reunions\n63. Going ice skating, roller skating/blading\n64. Going sailing\n65.Travelling abroad, interstate or within the\nstate\n66. Sketching, painting\n67. Blowing bubbles\n68. Doing embroidery, cross stitching\n69. Sleeping\n70.Driving ks on the riverfront/shoreline\n109. Buying gifts\n110. Travelling to national parks\n111. Completing a task\n112. Thinking about my achievements\n113. Going to a sporting event\n114. Eating gooey, fattening foods\n115. Exchanging emails, chatting on the\ninternet\n116. Photography\n117. Going fishing\n118. Thinking about pleasant events\n119. Staying on a diet\n120. Star gazing\n121. Flying a plane\n122. Reading fiction\n123. Acting\n124. Being alone\n125. Writing diary/journal entries or letters\n126. Cleaning\n127. Reading non-fiction\n128. Taking children places\n129. Dancing\n130. Going on a picnic\n131. Thinking \"I did that pretty well\" after\ndoing something\n132. Meditating/ Mindfulness exercises\n133. Playing volleyball\n134.", "topics": ["going", "thinking", "reading", "drive", "listening", "stereo", "refinishing", "furniture"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 48, "text": "30. Going on a picnic\n131. Thinking \"I did that pretty well\" after\ndoing something\n132. Meditating/ Mindfulness exercises\n133. Playing volleyball\n134. Having lunch with a friend\n135. Making a gratitude list\n136. Thinking about having a family\n137. Thoughts about happy moments in my\nchildhood\n138. Splurging\n139. Playing cards\n140. Having a political discussion\n141. Solving riddles mentally\n142. Playing tennis\n143. Seeing and/or showing photos or slides\n144. Knitting/crocheting/quilting\n145. Doing crossword puzzles\n146. Shooting pool/Playing billiards\n147. Dressing up and looking nice\n148. Reflecting on how I've improved\n149. Buying things for myself\n150. Talking on the phone\n151. Going to museums, art galleries\n152. Thinking religious thoughts\n153. Surfing the internet\n154. Lighting candles\n155. Listening to the radio\n156. Spending time in nature\n157. Having coffee at a cafe\n158.", "topics": ["playing", "having", "thinking", "going", "thoughts", "picnic", "pretty", "well"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 49, "text": "us thoughts\n153. Surfing the internet\n154. Lighting candles\n155. Listening to the radio\n156. Spending time in nature\n157. Having coffee at a cafe\n158. Getting/giving a massage\n159. Saying \"I love you\"\n160. Thinking about my good qualities\n161. Buying books\n162. Having a spa, or sauna\n163. Going skiing\n164. Going canoeing or white-water rafting\n165. Going bowling\n166. Doing woodworking\n167. Fantasizing about the future\n168. Doing ballet, jazz/tap dancing\n169. Debating\n170. Playing computer games\n171. Having an aquarium\n172. Erotica (sex books, movies)\n173. Going horseback riding\n174. Going rock climbing\n175. Thinking about becoming active in the\ncommunity\n176. Doing something new\n177. Making jigsaw puzzles\n178. Thinking I'm a person who can cope\n179. Playing with my pets\n180. Having a barbecue\n181. Rearranging the furniture in my house\n182. Buying new furniture\n183.", "topics": ["going", "having", "thinking", "buying", "books", "playing", "new", "furniture"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 50, "text": "g I'm a person who can cope\n179. Playing with my pets\n180. Having a barbecue\n181. Rearranging the furniture in my house\n182. Buying new furniture\n183. Going window shopping\n184. Saying yes to an opportunity\n5.21\n\nValues, Pleasure, and Mastery Activities List\nPleasure\n1. _____________________________________\n2. ______________________________________\n3. ______________________________________\n4. ______________________________________\n5. ______________________________________\n6. ______________________________________\n7. ______________________________________\n8. ______________________________________\n9. ______________________________________\n10. ____________________________________\nLook back at the last 6 pages and write down the activities you came up with to form a\nmaster list of possible activities that fit with your life aims.", "topics": ["activities", "furniture", "pleasure", "list", "i'm", "person", "cope", "playing"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 51, "text": "ook back at the last 6 pages and write down the activities you came up with to form a\nmaster list of possible activities that fit with your life aims. We'll use these to start to\nget more active with Behavioral Activation.\nMastery\n1. _____________________________________\n2. ______________________________________\n3. ______________________________________\n4. ______________________________________\n5. ______________________________________\n6. ______________________________________\n7. ______________________________________\n8. ______________________________________\n9.", "topics": ["activities", "ook", "back", "last", "pages", "write", "came", "form"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 52, "text": "_____________________\n6. ______________________________________\n7. ______________________________________\n8. ______________________________________\n9. ______________________________________\n10. ____________________________________\nValued Activities\n1. __________________________________________________________________________\n2. __________________________________________________________________________\n3. __________________________________________________________________________\n4. __________________________________________________________________________\n5. __________________________________________________________________________\n6. __________________________________________________________________________\n7. __________________________________________________________________________\n8. __________________________________________________________________________\n5.22", "topics": ["valued", "activities"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 53, "text": "__________________________________________________________________\n8. __________________________________________________________________________\n5.22\n\nGoal Setting\nIn order for goals to be achieved, they must be \"SMART:\"\nSpecific: when creating a goal, state exactly what you want to achieve.\nThink about how and when you are going to achieve your goal. For\nexample, \"I want to lose ten pounds in two months by counting calories.\"\nMeasurable: in order to say you met a goal, one must be able to\nmeasure it. Stating that \"I want to eat more fruits and vegetables\" is not\nas measurable as stating \"I want to eat a combination of 5 fruits and\nvegetables a day.\"\nAttainable: Is the goal possible? If the goal is to get into shape by\nswimming 30 laps a day and you have never swum for exercise, you will\nbe setting yourself up for avoidance and discouragement.", "topics": ["goal", "want", "setting", "order", "must", "achieve", "measurable", "stating"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 54, "text": "is to get into shape by\nswimming 30 laps a day and you have never swum for exercise, you will\nbe setting yourself up for avoidance and discouragement. Choose a\nsmaller goal, like taking a few swimming lessons or just swimming a few\nlaps to start.\nRealistic: is the goal realistic? If you have had a knee injury or chronic\npain, it is probably not realistic to set a goal for yourself of joining a\nkickboxing class. Perhaps joining a walking program would be more\nrealistic.\nTrackable: tracking your progress helps us notice improvement. When\nwe recognize our improvement, it motivates us to continue our
