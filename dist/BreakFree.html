 good\nwork. It can also help in creating future goals.\nGoals are how we make our values, pleasure, and mastery\nactivities real and practical. On the next few pages we will\nstart to schedule the activities that we recorded on the\nValues, Pleasure, and Mastery Activities List.", "topics": ["realistic", "swimming", "goal", "activities", "laps", "will", "yourself", "start"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 55, "text": "l and practical. On the next few pages we will\nstart to schedule the activities that we recorded on the\nValues, Pleasure, and Mastery Activities List. Before we do,\nit is important to be sure we are being \"SMART\" about\nsetting these goals. Use the following tips to increase the\nchances of reaching your goals.\n5.23\n\nSo far, we have…\n•  …determined how you spend your\ntime and how your current activities are\nassociated with your mood.\n•  …started to understand your values,\nenjoyable activities, and activities that\nmake you feel a sense of mastery and\naccomplishment.", "topics": ["activities", "values", "mastery", "goals", "practical", "next", "pages", "will"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 56, "text": "with your mood.\n•  …started to understand your values,\nenjoyable activities, and activities that\nmake you feel a sense of mastery and\naccomplishment. We've connected\nthese with specific activities that you\nwrote on the Values, Pleasure, and\nMastery Activities List.\n•  …learned how to be smart about\nsetting goals.\nNow it's time to start activating! One way to make Behavioral Activation work is\nto simply start to schedule activities and then rate how our mood corresponds\nto each activity. Use the chart on the following page to choose some activities\nwith which to start. You'll check the ones you complete and then rate your\nmood during the activity.\nActivity Planning Tips:\n• Start with 2-3 of the easiest activities.\n• Schedule activities on the day and time you think you could reasonably complete them.", "topics": ["activities", "start", "mood", "activity", "values", "make", "mastery", "time"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 57, "text": "ity Planning Tips:\n• Start with 2-3 of the easiest activities.\n• Schedule activities on the day and time you think you could reasonably complete them. For\nexample, if my activity is \"play with my daughter\" I might enter that activity at 11 am on\nMonday, 10 am on Wednesday, and 9 am on Thursday.\n• Consider whether you are ready for a particular activity and consider any barriers. For\nexample, if my activity is \"exercise,\" one barrier might be that I don't have any gym clothes.\nPerhaps I need to first complete the activity \"purchase gym clothes\" before I'll be ready to hit\nthe gym.\n• If you are unable to do an activity on the day or time that you first planned, just cross it out,\nwrite the activity that you did that that time, and try to reschedule your planned activity.\n• Remember not to get discouraged if you aren't able to complete all of the activities.", "topics": ["activity", "activities", "time", "complete", "gym", "day", "example", "consider"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 58, "text": "d that that time, and try to reschedule your planned activity.\n• Remember not to get discouraged if you aren't able to complete all of the activities. Try to\ncontinue to move forward with the activity anyway, even if it isn't going as you hoped.\n5.24\n\n Activity Completed Mood rating\n5-7:00 am\n __________________________________________________________________________________________________________\n7:00 am\n __________________________________________________________________________________________________________\n8:00 am\n __________________________________________________________________________________________________________\n9:00 am\n __________________________________________________________________________________________________________\n10:00 am\n __________________________________________________________________________________________________________\n11:00 am\n _______________________", "topics": ["activity", "try", "time", "reschedule", "planned", "remember", "get", "discouraged"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 59, "text": "10:00 am\n __________________________________________________________________________________________________________\n11:00 am\n __________________________________________________________________________________________________________\n12:00 pm\n __________________________________________________________________________________________________________\n1:00 pm\n __________________________________________________________________________________________________________\n2:00 pm\n __________________________________________________________________________________________________________\n3:00 pm\n __________________________________________________________________________________________________________\n4:00 pm\n __________________________________________________________________________________________________________\n5:00 pm\n ____________________________________________________________________________", "topics": []}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 60, "text": "________________________________________________________________\n5:00 pm\n __________________________________________________________________________________________________________\n6:00 pm\n __________________________________________________________________________________________________________\n7:00 pm\n __________________________________________________________________________________________________________\n8:00 pm\n __________________________________________________________________________________________________________\n9:00 pm\n __________________________________________________________________________________________________________\n10:00 pm\n __________________________________________________________________________________________________________\n11:00 pm\n __________________________________________________________________________________________________________\nScheduled Activities", "topics": ["scheduled", "activities"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 61, "text": "___________\n11:00 pm\n __________________________________________________________________________________________________________\nScheduled Activities for (name): ___ Day of week/date _______\nInstructions: Write some specific activities that you recorded on the \"Values, Pleasure, and Mastery Activities List\" in\nthe \"activity\" column. Place a check in the \"completed\" column to indicate if you completed the scheduled activity.\nRecord a mood rating in the last row; mood is rated between 0-10 (\"0\" indicating \"most negative\" and \"10\"\nindicating \"most positive.\"\n5.25\n\nPleasure Predicting\nWe are depressed we often anticipate getting little to no pleasure or\nmastery out of an activity. Depression clouds our judgment and colors\nour predictions about the future.\nAs an experiment, we can \"pleasure predict\" how much pleasure or\nmastery we feel after a given activity.", "topics": ["pleasure", "activity", "activities", "mastery", "scheduled", "column", "completed", "mood"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 62, "text": "and colors\nour predictions about the future.\nAs an experiment, we can \"pleasure predict\" how much pleasure or\nmastery we feel after a given activity. This is one way that we can mix\nBehavioral Activation with the Cognitive Skills we learned in Chapter 4.\nWe perform a \"behavioral experiment,\" which means that we see what\nhappens when we plan an activity, recording the \"data,\" to see what we\nlearn. People tend to learn that activities are more enjoyable than they\nhad predicted. See what happens for you!\nUse the sheet on the following page\nto \"pleasure predict\" some activities\nthis week.\nFirst, pick an achievable activity,\nespecially one that you predict may\nnot be enjoyable. Schedule the\nactivity using the Activity Planning\nWorksheet on the previous page.\nFill in the form on the next page,\nrecording your \"prediction\" before\nyou start the activity on a scale of\n0-10.", "topics": ["activity", "pleasure", "predict", "see", "page", "experiment", "one", "behavioral"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 63, "text": "nning\nWorksheet on the previous page.\nFill in the form on the next page,\nrecording your \"prediction\" before\nyou start the activity on a scale of\n0-10. Right after the activity is\nfinished, record how much you\nactually enjoyed it.\n5.26\n\nActivity\n(Schedule activities with a\npotential for pleasure or\npersonal growth)\n_______________________\n_______________________\n_______________________\n_______________________\nCompanion(s)\n(If alone, specify \"self\"- do\nnot put the word \"alone\" in\nthis column)\n_______________________\n_______________________\n_______________________\n_______________________\nSatisfaction (rate on scale of 0-10)\nPredicted Actual___\n___________________\nActivity\n_______________________\n_______________________\n_______________________\n_______________________\nActivity\n_______________________\n_______________________\n_______________________\n_______________________\nCompanion(s)\n________", "topics": ["activity", "page", "scale", "companion", "alone", "nning", "worksheet", "previous"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 64, "text": "_______________________\nActivity\n_______________________\n_______________________\n_______________________\n_______________________\nCompanion(s)\n_______________________\n_______________________\n_______________________\n_______________________\nCompanion(s)\n_______________________\n_______________________\n_______________________\n_______________________\nSatisfaction (rate on scale of 0-10)\nPredicted Actual___\n___________________\nSatisfaction (rate on scale of 0-10)\nPredicted Actual___\n___________________\n5.27\n\nWhen a problem arises, there many possible responses. As we have discussed throughout this manual,\nsome responses to depression and problems can help to solve these problems; others can serve to\nmake things worse. Below we describe three ways of addressing a problem. One approach may work\nbest, or all three may apply.", "topics": ["companion", "satisfaction", "rate", "scale", "predicted", "actual", "problem", "responses"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 65, "text": "lems; others can serve to\nmake things worse. Below we describe three ways of addressing a problem. One approach may work\nbest, or all three may apply. The \"take home point\" here is that all situations are different, and require\ndifferent types of approaches to help you meet your life aims.\nAdaptive Response #2: Problem solving (actions/behaviors)\nSometimes the best answer to a problem is working to \"solve\" the problem\nsomehow-it is not a problem with our thinking or behavior, it is a problem with\nthe external circumstances. For example, if someone is consistently aggressive\nor abusive of us, we may want to find a way to set firm limits with that person or\nleave the relationship altogether.", "topics": ["problem", "may", "three", "best", "different", "lems", "others", "serve"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 66, "text": "meone is consistently aggressive\nor abusive of us, we may want to find a way to set firm limits with that person or\nleave the relationship altogether. There are many problem solving skills, some of\nwhich are outlined below:\n -Behavioral Activation skills to address avoidance\n -Assertively address interpersonal conflicts\n -Take small steps to make progress on long-term projects\n -Plan for the future\n -Manage your time effectively\n -many others…\nTalk to your therapist or group leader about other behavioral skills to directly\naddress problems that arise.\nAdaptive Response #1: Get the facts (thinking)\nUse cognitive skills to better understand the \"facts\" of a situation. Perhaps there\nis a problem, and perhaps there is not.", "topics": ["skills", "there", "address", "problem", "behavioral", "facts", "perhaps", "meone"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 67, "text": ": Get the facts (thinking)\nUse cognitive skills to better understand the \"facts\" of a situation. Perhaps there\nis a problem, and perhaps there is not. Sometimes the first step is to understand\nthe facts of a situation, and then decide whether or not to use problem solving\nskills (below) or accept things that are outside of our control. Also see the earlier\nsection on \"Cognitive Therapy Skills.\"\nAdaptive Response #3: Accept what cannot be controlled (letting go)\nThere are times that we believe we should be able to control something,\nyet our consistent attempts to do so are met with failure. This \"beating a\ndead horse\" makes us more and more frustrated, angry, anxious, and\ndepressed. Sometimes letting go of things we cannot control is\nnecessary to prevent problems from getting even worse; we also lift\nsome of the burden of failing over and over.\nHow to take action\nto solve a problem\n1.", "topics": ["facts", "skills", "there", "problem", "control", "use", "cognitive", "understand"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 68, "text": "essary to prevent problems from getting even worse; we also lift\nsome of the burden of failing over and over.\nHow to take action\nto solve a problem\n1. Write down clearly what\nthe problem is.\n 2. Brainstorm about ways\nto solve the problem, even\n\"ridiculous\" ways, writing\ndown all possibilities.\n3. Rank the possible\nsolutions in order, from\nbest to worst. Think \"how\nlikely is it for this approach\nto work?\"\n4. Decide on a plan of\naction for each reasonable\nsolution. Rate how\nprobable it would be each\neach plan to work.\n5. Pick the most reasonable\nplan and put the plan into\naction. If it doesn't work,\ngo to the next best\nsolution and try that one.\nContinue to try until you\nsolve the problem.\nHow do I know what to do to make it better?\nSometimes it is difficult to know which approach to take to make a situation better.", "topics": ["problem", "plan", "action", "solve", "work", "even", "take", "ways"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 69, "text": "ou\nsolve the problem.\nHow do I know what to do to make it better?\nSometimes it is difficult to know which approach to take to make a situation better. While it is\nultimately an individual decision, one that may take trial and error, therapy is a place to work out\nsome of these difficult choices. The various skills in CBT are meant to help us get some clarity\naround some of these decisions. While we don't have room in this manual to discuss in detail how to\nmake these decisions, this is something to discuss with your group or individual therapist as you\nmove through treatment.\n5.28\n\nFrom the outside-in…\nAs we discussed in the \"Action Precedes Emotion?\" section earlier, one reason we\nstruggle with motivation is that we are looking to our internal emotional state\n(happy, energized, excited) to cue us to start a task.", "topics": ["make", "know", "better", "difficult", "take", "while", "individual", "one"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 70, "text": ", one reason we\nstruggle with motivation is that we are looking to our internal emotional state\n(happy, energized, excited) to cue us to start a task. This is an \"inside-out\" way of\nthinking which is problematic with depression, because for most people, low\nmotivation/energy is a pervasive symptom that typically takes some time to resolve.\nIn Behavioral Activation we ask people to work from the outside-in, acting\naccording to a plan rather than waiting to feel ready. We can jump-start our mood\nby starting with an action and letting our mood follow. This is hard at first, but over\ntime, most people recognize that their actions can actually have an impact on their\nmood, so they feel less at the mercy of their depression.\nLittle by little…\nWorking on doing things that you have been avoiding can sometimes feel\npainful or even cause some anxiety.", "topics": ["people", "feel", "mood", "motivation", "depression", "most", "time", "little"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 71, "text": "ercy of their depression.\nLittle by little…\nWorking on doing things that you have been avoiding can sometimes feel\npainful or even cause some anxiety. While plunging into these behaviors\nmight seem ideal, you will likely have more success if you commit to taking\nsmall steps.\nIf you are experiencing depression, chances are you're\ndealing with motivational difficulties. Frequently we hear\npeople (depressed or not) talk about waiting to make\nchanges when they are \"ready\" as if there is a particular\nday that they will wake up and suddenly feel different\nand able to face whatever it is they are avoiding.", "topics": ["depression", "little", "avoiding", "feel", "will", "ercy", "working", "things"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 72, "text": "they are \"ready\" as if there is a particular\nday that they will wake up and suddenly feel different\nand able to face whatever it is they are avoiding. We put\noff exercise routines, diets, getting homework done,\ncalling back important people, etc., because we feel\nunmotivated.\nFor example, if you and your therapist identify exercise as a goal, you might break this down into\nsteps.\nIf you'd like to run, but you've been inactive for months, chances are you're not going to just start\nrunning. By breaking this down into smaller goals you will likely have more success. Let's say you\nset a goal to put on your shoes and walk for 10 minutes, then 20, then 30, etc. Once you've built\nsome momentum, you then might begin to run.\nUse the \"Motivation Tips\" on the following page to help you get unstuck when low motivation\nstrikes.\n5.29", "topics": ["will", "feel", "put", "exercise", "etc", "goal", "run", "you've"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 73, "text": "some momentum, you then might begin to run.\nUse the \"Motivation Tips\" on the following page to help you get unstuck when low motivation\nstrikes.\n5.29\n\n1. Keep it simple\n2. Break it into smaller pieces\n3. Do one thing at a time\n4. Set realistic goals\n5. Schedule activities at times when you are most\nlikely to succeed\n6. Use self-compassion\n7. Anticipate setbacks\n8. Reinforce and reward healthy behavior choices\n9. Reflect on what works and what doesn't work\n10. Change your environment\n11. Minimize distractions\n12. Use visual reminders\n13. Talk yourself into it-challenge negative\nthinking!\n14. Use a timer-start with just five minutes\n15. Use reminders/alarms\n16. Have an accountability partner\n17. Focus on long-term benefits\n18. Commit to making decisions based on what we\nknow, not on what we feel\n5.30", "topics": ["use", "motivation", "reminders", "momentum", "begin", "run", "tips", "following"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 74, "text": "rms\n16. Have an accountability partner\n17. Focus on long-term benefits\n18. Commit to making decisions based on what we\nknow, not on what we feel\n5.30\n\nBehavioral Activation Tips\nBehavioral Activation can be challenging! It\nis common to run into roadblocks during this\nprocess and have moments in which we\nwant to give up. We can honestly say that\nthe only barrier to improvement is giving up\ncompletely; if you continue to learn about\nyour valued life course and stay \"out there,\"\nchances are that things will improve.\n1. Be prepared for a challenge: because we are working against our brain's\nattempts to protect us, it takes effort and some discomfort to get results\nfrom Behavioral Activation in the long run.\n2. Get \"back on the horse:\" when failures inevitably happen, be prepared to\nrespond actively.", "topics": ["behavioral", "activation", "run", "prepared", "get", "rms", "accountability", "partner"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 75, "text": "get results\nfrom Behavioral Activation in the long run.\n2. Get \"back on the horse:\" when failures inevitably happen, be prepared to\nrespond actively. Depression will tell us to give up when things don't go\nwell… and try to convince us that all of those negative thoughts are the\ntruth. Prove the depression wrong by getting back out there and moving\ntoward what you really value.\n3. Move one step at a time: retraining the brain takes time, one small step at\na time. Trying to move too quickly is a recipe for failure and\ndisappointment, and overwhelms us so that we want to give up.\n4. Address negative thinking: go back and review the Cognitive Therapy\nSkills chapter and continue to address the thinking that tries to keep us\nisolated.", "topics": ["back", "time", "get", "depression", "give", "negative", "move", "one"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 76, "text": "ddress negative thinking: go back and review the Cognitive Therapy\nSkills chapter and continue to address the thinking that tries to keep us\nisolated. Especially address self-critical thoughts and develop selfcompassion.\n5. Focus on valued action, not just on \"symptom reduction.\" Gauge success\naccording to the extent that you are living a valued life, not whether or\nnot you have emotions. While one aim of CBT is to improve mood and\nhave fewer negative emotions in the long run, in the short run we must\nremember that emotions are a part of life and we cannot get rid of them\ncompletely. But… we can improve life and how we feel by moving toward\nvalued actions.\nUse the tips below to help navigate barriers that come up during the course of\nBehavioral Activation treatment.\nContinued on the next page… 5.31", "topics": ["valued", "life", "emotions", "negative", "thinking", "address", "improve", "run"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 77, "text": "ons.\nUse the tips below to help navigate barriers that come up during the course of\nBehavioral Activation treatment.\nContinued on the next page… 5.31\n\nBehavioral Activation Tips, con.\n6. Monitor your activities and mood as specifically as you can. We often\nmiss important clues to treating depression when we don't pay enough\nattention to the details of our activity.\n7. Solve problems that could be leading to further depressive symptoms,\nand work to accept those things that cannot be solved, while continuing\nto move toward life aims to the best of your ability.\n8. Be sure your activities line up with your true values. Sometimes we think\nwe are living a valued life and we are not; this leads to continual\ndisappointments. Continue to explore your values.", "topics": ["tips", "behavioral", "activation", "activities", "life", "values", "ons", "use"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 78, "text": "true values. Sometimes we think\nwe are living a valued life and we are not; this leads to continual\ndisappointments. Continue to explore your values. Remember that\nvalues are not internal states, how people treat us, or specific things to\nachieve.\n9. Be sure you have the skills you need to be successful. Trying to do\nsomething in which we don't have the necessary skills sets us up for\nfailure. Some people learn that they are \"incompetent,\" only because\nthey continue to try to do things for which they are not ready. Find out\nwhat skills are necessary to be successful at a given task, and then, given\nthe amount of work it would take to learn the necessary skills, decide if it\nmakes sense to continue to pursue that activity.\n10. Understand the principles of Behavioral Activation and why each part of\nit is necessary.", "topics": ["skills", "necessary", "values", "continue", "people", "things", "successful", "learn"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 79, "text": "de if it\nmakes sense to continue to pursue that activity.\n10. Understand the principles of Behavioral Activation and why each part of\nit is necessary. Sometimes we are confused about why we are doing\nsomething; this potentially leads to resistance to trying new things, and\nwe miss out on the possible benefits.\n11. Practice mindfulness: review Chapter 3 and practice mindfulness.\nResearch shows that enjoyment is much more likely when we are present\nand mindful. Use Behavioral Activation as an opportunity to practice\nbeing mindful of potentially pleasurable experiences as they occur.\n12. Reward yourself for your achievements. Depression and self-criticism try\nto take away the \"kudos\" we deserve when we achieve something. Make\nan explicit effort to reward yourself instead.\n5.32\n\nBarriers and Resources Worksheet\nUse the following worksheet to determine the specifics of some of your\ngoals.", "topics": ["practice", "behavioral", "activation", "something", "potentially", "mindfulness", "mindful", "use"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 80, "text": "ffort to reward yourself instead.\n5.32\n\nBarriers and Resources Worksheet\nUse the following worksheet to determine the specifics of some of your\ngoals. Think about possible barriers and resources you might have to\nhurdle them.\nGoal: _____________________________________________________________\nWhen I want to achieve it:___________________________________________\n__________________________________________________________________\nHow I am going to do it:_____________________________________________\n__________________________________________________________________\nHow I am going to measure it:_______________________________________\n__________________________________________________________________\nWhat are possible barriers?__________________________________________\n__________________________________________________________________\nWhat are the possible resources?___________________________", "topics": ["barriers", "resources", "possible", "worksheet", "going", "ffort", "reward", "yourself"]}, {"doc_id": "ba-Behavioral-Activation-for-Depression", "modality": "ba", "label": "Behavioral Activation for Depression", "i": 81, "text": "_______________________\n__________________________________________________________________\nWhat are the possible resources?_____________________________________\n__________________________________________________________________\n5.33", "topics": ["possible", "resources"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 0, "text": "1\nGraded\nExposure\n\n 2\nWhen to use this workbook\nGraded Exposure is an evidence based intervention for the treatment of anxiety and phobias.\nThis workbook can be used either alone as a self help resource or with the support of a Psychological\nWellbeing Practitioner.\n\nHow to use this workbook.\nGraded Exposure has three steps.\nIt is important to work through one step at a time, only move on to the next step of Graded Exposure\nonce you are comfortable with using the previous step. It is key to follow all three steps of Graded\nExposure in sequence.\nIt can take some time for an intervention to become effective and to show improvement. It is\nimportant to allow enough time for the intervention to be effective.\n\nHelpful Resources: https://www.talkplus.org.uk/graded-exposure-video-module", "topics": ["graded", "exposure", "workbook", "intervention", "step", "time", "use", "three"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 1, "text": "is\nimportant to allow enough time for the intervention to be effective.\n\nHelpful Resources: https://www.talkplus.org.uk/graded-exposure-video-module\n\nExposure and Habituation https://talkchanges.org.uk/wp-content/uploads/2020/05/ExposureHabituation.pdf\nFacing Your Fears https://www.anxietycanada.com/strategies-and-techniques/facing-fears/\nAnxiety UK https://www.anxietyuk.org.uk/\n\nEvidence Base for Graded Exposure:\nNHS Phobias https://www.nhs.uk/mental-health/conditions/phobias/treatment/\nNHS Agoraphobia https://www.nhs.uk/mental-health/conditions/agoraphobia/treatment/\nNICE Guidance https://www.nice.org.uk/guidance/cg123/chapter/1-Guidance#steps-2-and-3treatment-and-referral-for-treatment\n\nGraded Exposure", "topics": ["https", "www", "org", "nhs", "exposure", "guidance", "graded", "phobias"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 2, "text": "treatment/\nNICE Guidance https://www.nice.org.uk/guidance/cg123/chapter/1-Guidance#steps-2-and-3treatment-and-referral-for-treatment\n\nGraded Exposure\n\n 3\nJo's Story\nJo is 32, and has struggled with a fear of driving that has developed in the last few months following a\nperiod of not driving the car.\nThey said \"I never used to be scared of driving, I used to drive everywhere, an hour to work, in the\ncountryside and on motorways! But now even the thought of getting in a car makes my heart race. I\nfeel sweaty, shaky and even get light headed. It is having a huge impact on my life.\"\nJo began avoiding driving completely, they opted to work from home, asked friends to pick them up\nand wouldn't go anywhere that involved driving.", "topics": ["driving", "guidance", "nice", "car", "used", "work", "even", "treatment"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 3, "text": "fe.\"\nJo began avoiding driving completely, they opted to work from home, asked friends to pick them up\nand wouldn't go anywhere that involved driving. This meant that Jo even became fearful of being a\npassenger in someone else's car.\nJo knew that this couldn't carry on, so Jo googled \"ways to overcome driving phobia\" and found out\nabout graded exposure. When looking on the NHS website, Jo saw that graded exposure could be done\nin a type of therapy called CBT. Jo looked at their local area and found TalkPlus provided this.\n\"When I referred to TalkPlus, I really wanted a quick fix but soon learnt that graded exposure, was going to take hard work and lots of practice.\"\nJo worked with a psychological wellbeing-practitioner in 30 minute sessions of guided self-help on driving phobia. They used the vicious cycle to work out what was maintaining Jo's problem.", "topics": ["driving", "work", "graded", "exposure", "phobia", "found", "talkplus", "began"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 4, "text": "g-practitioner in 30 minute sessions of guided self-help on driving phobia. They used the vicious cycle to work out what was maintaining Jo's problem. It seemed that\nbecause Jo was avoiding, they were never allowing the anxiety to lessen therefore each time they got in\na car they felt just as scared as before.\nJo set goals for treatment to be able to drive to and from work, twice a week and began with step one of\ngraded exposure by identifying \"anxiety provoking situations\", after this they were able to rank them in\na hierarchy from least feared to most feared.\nThey could then begin planning their first exposure, keeping in mind the four conditions to successfully\ncomplete graded exposure.", "topics": ["exposure", "work", "anxiety", "able", "graded", "feared", "g-practitioner", "minute"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 5, "text": "red to most feared.\nThey could then begin planning their first exposure, keeping in mind the four conditions to successfully\ncomplete graded exposure. They found the first activities fairly straight forward and noticed the anxiety\nbegan to drop as they stayed in the anxiety provoking situation.\nHowever, Jo decided to skip some activities on the ladder and jump to a more feared activity without\nrepeating previous exposures. Jo found this flooded them with fight or flight anxiety symptoms which\nknocked their confidence.", "topics": ["anxiety", "feared", "first", "exposure", "found", "activities", "red", "most"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 6, "text": "feared activity without\nrepeating previous exposures. Jo found this flooded them with fight or flight anxiety symptoms which\nknocked their confidence. Despite this Jo returned to the less feared activities, and continued to repeat them in a graded manner without distraction making them prolonged enough to habituate.\nJo completed all 6 sessions of graded exposure and now feels comfortable driving to and from work\nagain.\n\"Using graded exposure, I was able to get my independence back! Although I still have some anxiety\naround driving, I know that I can continue to use graded exposure to make myself feel more comfortable and achieve my goals.\"\n\nYou can find Jo's example sheets before each\nblank template\n\n 4", "topics": ["graded", "exposure", "feared", "without", "anxiety", "comfortable", "driving", "activity"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 7, "text": "e to use graded exposure to make myself feel more comfortable and achieve my goals.\"\n\nYou can find Jo's example sheets before each\nblank template\n\n 4\n\nThe CBT or vicious cycle below gives an example of some worries and how this can be maintained.\nWhat is anxiety?\nWe can feel anxiety in different ways, it can be an emotion, or we can experience feelings of anxiety\nin our bodies. This is the fight/fight/freeze reflex which serves to protect us when we are threatened\nwith dangerous situations. Adrenaline is pumped into our body to help prepare us and blood is\ndirected to the large muscle groups ready to fight or run away.\nThis can cause symptoms like the physical ones listed below.\nThe Vicious Cycle of Anxiety and Avoidance", "topics": ["anxiety", "fight", "feel", "example", "vicious", "cycle", "below", "use"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 8, "text": "rge muscle groups ready to fight or run away.\nThis can cause symptoms like the physical ones listed below.\nThe Vicious Cycle of Anxiety and Avoidance\n\nHow does avoidance affect Anxiety?\nWhen we fear certain situations, objects or activities, we either avoid or leave the situation or use\nsafety behaviours in order to reduce our anxiety.\nAlthough this may be helpful in reducing our distress in the short term, avoidance can help to\nmaintain this pattern of fear and anxiety as shown above.", "topics": ["anxiety", "avoidance", "fear", "rge", "muscle", "groups", "ready", "fight"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 9, "text": "though this may be helpful in reducing our distress in the short term, avoidance can help to\nmaintain this pattern of fear and anxiety as shown above. Therefore each time we go into a feared\nsituation we experience the same high level of anxiety\ntime after time, by experiencing physical symptoms and\nthe anxious emotions as well as unhelpful thoughts\naround the situation.\nWhat is Graded Exposure?\nAvoid anxiety provoking\nsituation or things\nUse safety behaviour to\ncope with anxiety\nHeart pounding\nSweaty palms\nFeeling sick\nTunnel vision\nRestlessness\nAnxious\nPanicked\nScared\nUpset\n\n'I won't be able to cope'\n'Something bad might\nhappen'\n'need to get out of here'\n\n 5", "topics": ["anxiety", "time", "situation", "anxious", "though", "may", "helpful", "reducing"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 10, "text": "g sick\nTunnel vision\nRestlessness\nAnxious\nPanicked\nScared\nUpset\n\n'I won't be able to cope'\n'Something bad might\nhappen'\n'need to get out of here'\n\n 5\n\nWrite down anxious thoughts that you have experienced recently in the box and then see how that made you feel emotionally, how it\nchanged what you did or didn't do (your behaviour) and also what you felt in your body like anxiety symptoms.\nWhat does your vicious cycle look like?\n\n 6\n\nWhy set goals?\nGoal setting is an evidence based way of helping ourselves to decide on things you would like to\nachieve and what you will do to get there as well as work toward them.\nThis helps us to stay focused on achieving things that matter most to us.\n\nGoals should be:\n Focused on short term objectives to begin with\n Limited to no more than 3 goals\n Positive in nature\n\nYou can use SMART to help you consider your goals:", "topics": ["goals", "like", "anxious", "get", "things", "focused", "sick", "tunnel"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 11, "text": "sed on short term objectives to begin with\n Limited to no more than 3 goals\n Positive in nature\n\nYou can use SMART to help you consider your goals:\n\nSpecific Try and be specific with a time, date or anything you'll need to\nachieve the goal\nMeasurable Goals should be able to be measured on a scale\nAchievable Goals should not 'set you up to fail' and should be feel within\nreach\nRelevant Goals should be relevant to your life or current\nproblem\nTime specific Set a specific time or deadline to achieve your goal\nSetting Goals\n\n 7\n\nHave a go at creating your own goals and rating how much you have achieved\nyour goal so far:\n\n0 2 4 6 8 10\n= Not\nachieved this\ngoal at all\n= slightly\nachieved this\ngoal\n= somewhat\nachieved this\ngoal\n= markedly\nachieved this\ngoal\n= mostly\nachieved this\ngoal\n= completely\nachieved this\ngoal\nSetting Goals\n\nGoal 1\nWrite your goal here:\n\nGoal rating:\n /10", "topics": ["goal", "goals", "achieved", "specific", "time", "achieve", "set", "relevant"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 12, "text": "arkedly\nachieved this\ngoal\n= mostly\nachieved this\ngoal\n= completely\nachieved this\ngoal\nSetting Goals\n\nGoal 1\nWrite your goal here:\n\nGoal rating:\n /10\n\nGoal 2\nWrite your goal here:\n\nGoal rating:\n /10\n\nGoal 3\nWrite your goal here:\n\nGoal rating:\n /10\n\n 8\nTackling Avoidance in Feared Situations\nGraded Exposure is an evidence based treatment used to tackle avoidance of feared situations,\nactivities or objects due to anxiety. It works through a process called habituation, a gradual\nreduction in the physical sensations of anxiety. This is achieved through identifying feared\nsituations or objects and gradually exposing ourselves to them whilst following four conditions.\nHabituation\nAs shown in the left graph, when we leave a situation our anxiety immediately reduces,\nhowever the next time we enter that situation our anxiety becomes just as high.", "topics": ["goal", "achieved", "anxiety", "write", "here", "rating", "feared", "situations"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 13, "text": "left graph, when we leave a situation our anxiety immediately reduces,\nhowever the next time we enter that situation our anxiety becomes just as high. As in the past we\nhave found relief in leaving, this is what we often continue to do to reduce the distress we\nexperience.\nThe anxiety we experience is part of the 'fight or flight' response, a biological system to prepare us to\nrespond to frightening or dangerous situations. However physiologically we cannot remain at this\nhigh level of anxiety, so by exposing ourselves to the situation, and remaining in it, our anxiety\nnaturally reduces, this is the process of habituation.\nGraded exposure works by gradually exposing ourselves to the feared situation, beginning only with\nsituations that we feel we are able to tolerate, this can be seen in the graph on the right.", "topics": ["anxiety", "situation", "graph", "reduces", "however", "high", "experience", "situations"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 14, "text": "ng ourselves to the feared situation, beginning only with\nsituations that we feel we are able to tolerate, this can be seen in the graph on the right. This allows\nthe process of habituation to occur in order to reduce our\nfear and reduce our anxiety response in the long term.\nGraded Exposure\n\n 9\nIdentifying anxiety-provoking situations\n\nThe first step of Graded Exposure is to identify all the activities that cause you anxiety so that you are\neither avoiding them, leaving them or distracting yourself to try and cope. It may be that you have a\nnumber of different feared situations, objects or activities, it is then important to separate these fears\ninto different lists and select one specific fear to tackle at a time.", "topics": ["situations", "feared", "reduce", "fear", "anxiety", "graded", "exposure", "activities"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 15, "text": "ituations, objects or activities, it is then important to separate these fears\ninto different lists and select one specific fear to tackle at a time.\n\n• Avoiding or leaving a situation are just two things we might do to make ourselves feel safer and to\nreduce our anxiety.\n• There are often more subtle ways in which we avoid fully experiencing anxiety in situations.\nThese include distraction and safety behaviours, see the box on the next page below for\nexamples, to help identify the subtle behaviours we use to minimise distress.\n• Engaging in distraction and safety behaviours also maintains our fear of the situation in the long\nterm, much as avoiding or leaving it does. Therefore it is important to include these in our list, for\nexample going shopping with a friend instead of alone so we feel safer and experience less\nanxiety.", "topics": ["anxiety", "behaviours", "important", "fear", "avoiding", "leaving", "situation", "feel"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 16, "text": "it is important to include these in our list, for\nexample going shopping with a friend instead of alone so we feel safer and experience less\nanxiety.\n\nBe specific\nWhilst making the list of anxiety provoking situations, including when we distract ourselves, it is\nimportant to be specific.\nInclude in the list what, where, when and with whom each situation occurs.\nIt may be that there are a number of similar situations that cause anxiety, for example going\nshopping with a friend at 8am or going shopping with a friend at 4pm, due to the fact that these\nsmall differences cause different levels of anxiety.\n\nStep One\n\n 10\nIdentifying safety behaviours\n\nTo complete Step 1 use Worksheet 1 on page 12.\nFill in the worksheet with activities that provoke your\nanxiety.\nStep One (continued)", "topics": ["anxiety", "list", "going", "shopping", "friend", "step", "important", "include"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 17, "text": "fety behaviours\n\nTo complete Step 1 use Worksheet 1 on page 12.\nFill in the worksheet with activities that provoke your\nanxiety.\nStep One (continued)\n\nListening to Music Taking a friend or family member or partner\nWearing head/ear phones Carrying a bottle of water\nTalking on the phone Staying near an exit\nDrinking Alcohol Sitting/Staying next to someone you know\nPlanning your route before hand Overplanning before events\nCarrying Anxiety medication Having to do certain routines or follow plans\n Common distraction techniques and safety behaviours\n\nTry writing some of the safety behaviours you do below:", "topics": ["behaviours", "step", "worksheet", "anxiety", "carrying", "staying", "before", "safety"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 18, "text": "to do certain routines or follow plans\n Common distraction techniques and safety behaviours\n\nTry writing some of the safety behaviours you do below:\n\n 11\nAnxiety-Provoking Situations\n• Sitting in the car\n• Driving anywhere round the local area\n• Parking the car in a public carpark\n• Driving to unknow places or new towns\n• Being in a situation where I could have a car crash\n• Sitting in someone else's car\n• Driving with someone else in case I crash\n• Driving down windy country lanes\n• Driving on the motorway because it's fast\n• Someone driving close behind me\nBe Specific: What? When? Where? Who?\nJO'S EXAMPLE: WORKSHEET ONE\n\n 12\nAnxiety-Provoking Situations\n•\n•\n•\n•\n•\n•\n•\n•\n•\n•\nBe Specific: What? When? Where? Who?\nWORKSHEET ONE: Identifying anxiety-\nprovoking situations\n\n 13\nDeveloping a hierarchy", "topics": ["driving", "car", "situations", "someone", "safety", "behaviours", "anxiety-provoking", "sitting"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 19, "text": "uations\n•\n•\n•\n•\n•\n•\n•\n•\n•\n•\nBe Specific: What? When? Where? Who?\nWORKSHEET ONE: Identifying anxiety-\nprovoking situations\n\n 13\nDeveloping a hierarchy\n\nHaving identified a specific fear to work on, the second step of Graded Exposure is to rank the\nsituations identified in Worksheet 1 in order of the level of anxiety you experience. Ranking\nactivities from least anxiety-provoking, to most anxiety-provoking means that Graded Exposure can\nbe carried out gradually, without experiencing levels of anxiety that are overwhelming.\n\nActivities are ranked from those that would provoke the highest level of anxiety to those that provoke\nthe least intense anxiety. It is useful to think about the situation that would be easiest to remain in\nfirst and the situation that would be the most difficult, and then fill in situations in between.", "topics": ["anxiety", "situations", "specific", "worksheet", "identified", "graded", "exposure", "level"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 20, "text": "out the situation that would be easiest to remain in\nfirst and the situation that would be the most difficult, and then fill in situations in between. This\nprocess can seem very daunting or overwhelming at first therefore this stage of developing a\nhierarchy is very important. Sometimes it can be difficult to think of what would be more or less\nanxiety-provoking, therefore it is useful to;\n\nRate predicted anxiety levels\nIt can be helpful to mark on Worksheet 1 next to each situation how much anxiety it would provoke\nfrom 0-100%. This will then make it easier to place the situations or activities in a hierarchy, from the\nlowest to the highest percentage.\n\nStep Two\n\n 14\n\nBreak it down\nSometimes it is difficult to come up with several different variations of the same situation, especially\nas the feelings it causes are so overwhelming.", "topics": ["situation", "difficult", "first", "situations", "overwhelming", "therefore", "hierarchy", "sometimes"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 21, "text": "ometimes it is difficult to come up with several different variations of the same situation, especially\nas the feelings it causes are so overwhelming. By thinking of what, where, when and with whom each\nsituation occurs we can then break down the situations into many variations that cause different\nlevels of anxiety. The box below gives some examples of this, also see example sheets at the back.\nTo complete Step 2 use Worksheet 2 on page 16.\nRank the activities in order of how much anxiety they\nprovoke.\n\n• Different times of the day\n• With safety behaviours and without\n• Looking at a photograph\n\n• Watching a video\n• Larger or smaller locations\n• Alone or with a friend\n Breaking down your fears\nStep Two (continued)\n When What\nWhere Who", "topics": ["different", "variations", "situation", "anxiety", "step", "ometimes", "difficult", "come"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 22, "text": "ograph\n\n• Watching a video\n• Larger or smaller locations\n• Alone or with a friend\n Breaking down your fears\nStep Two (continued)\n When What\nWhere Who\n\n 15\nJO'S EXAMPLE: WORKSHEET TWO\nMost anxiety-provoking % Rating\nDrive on the motorway at rush hour 100%\nDrive on the motorway in light traffic 90%\nDrive on the dual carriage way 80%\nDrive on a country road 70%\nDrive to a new place in heavier traffic 60%\nDrive to a new place in light traffic 50%\nDrive around the local neighbourhood for 30 mins 40%\nDrive to around the local neighbour hood for 15 30%\nPull out of the driveway and drive a lap of the road 20%\nSit in the car with the ignition on 10%\nLeast anxiety-provoking\n\n 16\nWORKSHEET TWO: Developing a hierarchy\n\nMost anxiety-provoking % Rating\n\nLeast anxiety-provoking", "topics": ["drive", "anxiety-provoking", "two", "traffic", "worksheet", "most", "rating", "motorway"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 23, "text": "with the ignition on 10%\nLeast anxiety-provoking\n\n 16\nWORKSHEET TWO: Developing a hierarchy\n\nMost anxiety-provoking % Rating\n\nLeast anxiety-provoking\n\n 17\nPlanning exposures\nThe third step of Graded Exposure is to begin exposing yourself to feared situations, starting with\nthe least anxiety -provoking activity. When planning exposures it is important to make a specific\nplan to carry them out based on the four conditions of Graded Exposure. These conditions are\nGraded, Prolonged, Without Distraction and Repeated.\n\n1. Graded\nFacing fears can be a very difficult and overwhelming challenge,\ntherefore it is important to start by exposing yourself to a situation\nwhich causes some level of anxiety but is not too much. This is\nachieved by using the hierarchy developed in Step 2. In this way you\ncan move up the hierarchy only when you feel confident enough to do\nso.\n\n2.", "topics": ["graded", "least", "anxiety-provoking", "hierarchy", "planning", "exposures", "step", "exposure"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 24, "text": "is is\nachieved by using the hierarchy developed in Step 2. In this way you\ncan move up the hierarchy only when you feel confident enough to do\nso.\n\n2. Prolonged\nIt is important that we remain in the feared situation for long\nenough until anxiety naturally reduces through the process of\nhabituation. This process can take anywhere from 5 minutes to\n2 hours. It can be difficult to stay in the situation for this length\nof time, however if you leave before beginning to feel a\nreduction in anxiety you will continue to avoid the situations,\nand use this unhelpful strategy in the future.\n\nStep Three\n\n 18\n\n3. Without Distraction\nEngaging in safety behaviours or distraction whilst in an\nanxiety-provoking situation means we do not fully\nexperience the symptoms of anxiety.", "topics": ["situation", "anxiety", "hierarchy", "step", "feel", "enough", "process", "distraction"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 25, "text": "action\nEngaging in safety behaviours or distraction whilst in an\nanxiety-provoking situation means we do not fully\nexperience the symptoms of anxiety. Habituation cannot\noccur if we are reducing our anxiety in other ways,\ntherefore it is important to plan your exposure to ensure\nyou are not distracted in any way. It may be that to start\nwith it is too anxiety -provoking not to use any safety\nbehaviours that you might have been using for a long time.\nIn this case you can begin exposing yourself with these\nbehaviours, and then gradually reducing them.\n\n4. Repeated\nIn order for habituation to occur in a specific situation\nwe need to repeatedly expose ourselves. It is\nrecommended that an exposure to one situation is\nrepeated 4-5 times in one week. This may be difficult\nto achieve if the situations you are exposing yourself to\nare expensive, rare or involve others.", "topics": ["behaviours", "situation", "anxiety", "safety", "habituation", "occur", "reducing", "exposure"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 26, "text": "repeated 4-5 times in one week. This may be difficult\nto achieve if the situations you are exposing yourself to\nare expensive, rare or involve others. In these cases it\nis important to be creative, e.g. watch a video, and try\nto carry out as many exposures as possible.\n\nTo complete Step 3 use Worksheet 3 on page 20.\nWhen planning exposure in the diary be specific about what, where, when and with whom you will carry out the exposure.\nRate your level of anxiety, from 0 -100% before, during and after each\nexposure to monitor reductions in your anxiety levels. There is a\nspace to make any comments or record any reactions during each\nrepeated exposure.\n\nStep Three (continued)", "topics": ["exposure", "repeated", "carry", "step", "anxiety", "during", "times", "one"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 27, "text": "ductions in your anxiety levels. There is a\nspace to make any comments or record any reactions during each\nrepeated exposure.\n\nStep Three (continued)\n\n 19\n Date &\nTime\nDuration Exposure Anxiety Rating Comments\nBefore During After\n1 Saturday\n2pm\n30 minutes Driving round the local neighbourhood 60% 75% 40% It was hard to get back to\ndriving locally, but after I felt\nquite good about myself\n2 Sunday\n9.15am\n25 minutes Drive round the local neighbourhood 55% 65% 80% I felt very anxious during this\ndrive and I felt vey nervous I\nmight have a crash\n3 Tuesday\n4.15pm\n40 minutes Drive round the local neighbourhood 50% 55% 40% I was still nervous from\nSunday's drive but it went\nbetter than expected\n4 Wednesday\n3pm\n55 minutes Drive to new town 55% 50% 30% I'm was very scared about\ndriving somewhere unknown\nbut it went quite well\n5 Friday\n12.30pm\n60 minutes Drive to another new town 40% 30% 15% Found", "topics": ["drive", "minutes", "during", "driving", "round", "local", "neighbourhood", "felt"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 28, "text": "30% I'm was very scared about\ndriving somewhere unknown\nbut it went quite well\n5 Friday\n12.30pm\n60 minutes Drive to another new town 40% 30% 15% Found it really easy after\nyesterdays drive, even drove\na bit longer than before\n 0% 25% 50% 75% 100%\nNo Anxiety Mild Anxiety Moderate Anxiety Severe Anxiety Panic\nJO'S EXAMPLE: WORKSHEET THREE\n\n 20\n Date &\nTime\nDuration Exposure Anxiety Rating Comments\nBefore During After\n1\n2\n3\n4\n5\n 0% 25% 50% 75% 100%\nNo Anxiety Mild Anxiety Moderate Anxiety Severe Anxiety Panic\nWORKSHEET THREE: Planning Exposure\n\n 21\n\nWhat techniques have been most helpful?\nWhat are my early warning signs?\nAre there any future obstacles coming up?\n\nHow can I prepare for these?\n\nWhat are my future goals?\n(see next page for a goal sheet)\nMaintaining Progress\n\n 22", "topics": ["anxiety", "drive", "after", "before", "mild", "moderate", "severe", "panic"]}, {"doc_id": "ivex-Graded-Exposure", "modality": "ivex", "label": "In-Vivo Graded Exposure", "i": 29, "text": "e any future obstacles coming up?\n\nHow can I prepare for these?\n\nWhat are my future goals?\n(see next page for a goal sheet)\nMaintaining Progress\n\n 22\n\nHave a go at creating your own goals to continue your progress and rate how\nmuch you have achieved your goal so far:\n\n0 2 4 6 8 10\n= Not\nachieved this\ngoal at all\n= slightly\nachieved this\ngoal\n= somewhat\nachieved this\ngoal\n= markedly\nachieved this\ngoal\n= mostly\nachieved this\ngoal\n= completely\nachieved this\ngoal\nSetting Future Goals\n\nGoal 1\nWrite your goal here:\n\nGoal rating:\n /10\n\nGoal 2\nWrite your goal here:\n\nGoal rating:\n /10\n\nGoal 3\nWrite your goal here:\n\nGoal rating:\n /10\n\n 23\nBooklet created: August 2023\nReview due: August 2024", "topics": ["goal", "achieved", "future", "goals", "write", "here", "rating", "progress"]}]};
</script>
<script>
"use strict";

const STORAGE_KEY = "breakFree.v1";
const LEGACY_KEY = "baApp.v1";
const KNOWLEDGE_URL = "knowledge.json";

const WELCOME_TEXT =
  "Hi. I'm here whenever you want company. I'll be a lot more useful once I know you a little — what's heavy, what you care about, and how you like to be spoken to. I'd like to interview you a bit. There's no set number of questions and you can stop me anytime by saying \"enough\". Want to start? Just say yes, or jump into anything that's on your mind.";

const DEFAULT_STATE = {
  createdAt: new Date().toISOString(),
  user: { name: "" },
  goals: [],
  activations: [],
  logs: [],
  preferences: { tone: "warm", reminders: true, theme: "warm" },
  profile: {
    name: "",
    communicationStyle: null,   // 'warm' | 'concise' | 'direct'
    challengeLevel: null,       // 'gentle' | 'moderate' | 'push'
    struggles: [],              // ['depression','anxiety','avoidance','stuck']
    struggleNotes: [],
    avoiding: [],
    values: [],                 // top topics extracted from value answers
    valueNotes: [],
    energizers: [],
    energizerNotes: [],
    pastWins: [],
    bestTimes: [],              // ['morning','afternoon','evening','night','variable']
    interviewNotes: [],
    interviewStarted: false,
    interviewComplete: false,
    interviewSkipped: false,
    interviewProgress: { askedTopics: [], currentTopic: null, openCloseAsked: false }
  },
  coach: {
    mode: "free",               // 'free' | 'interview'
    memory: [
      {
        ts: new Date().toISOString(),
        role: "coach",
        text: WELCOME_TEXT,
        topics: ["welcome"]
      }
    ],
    topicCounts: {},
    facts: []
  }
};

const STOPWORDS = new Set(
  "a an and the to of in for on at with is am are was were be been being i me my you your we us our it its this that those these so but or if then than just very really maybe might can could would should do does did doing have has had not no yes ok okay over under up down out off again still more less because about into onto from as by what when where why how which who whose all any some many few each every other their them they he she him her his hers".split(
    " "
  )
);

const STATE = loadState();
let route = "home";
let calendarCursor = startOfMonth(new Date());
let calendarSelected = todayKey();
let createModality = "ba";

let KNOWLEDGE = null;
let KNOWLEDGE_PROMISE = loadKnowledge();

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function loadState() {
  try {
    let raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      const legacy = localStorage.getItem(LEGACY_KEY);
      if (legacy) {
        raw = legacy;
        localStorage.setItem(STORAGE_KEY, raw);
      }
    }
    if (!raw) return structuredClone(DEFAULT_STATE);
    const parsed = JSON.parse(raw);
    const merged = Object.assign(structuredClone(DEFAULT_STATE), parsed, {
      profile: Object.assign(
        structuredClone(DEFAULT_STATE.profile),
        parsed.profile || {}
      ),
      coach: Object.assign({}, DEFAULT_STATE.coach, parsed.coach || {})
    });
    if (!merged.coach.mode) merged.coach.mode = "free";
    if (!merged.profile.interviewProgress)
      merged.profile.interviewProgress = { askedTopics: [], currentTopic: null, openCloseAsked: false };
    merged.activations = (merged.activations || []).map((a) =>
      Object.assign({ modality: "ba" }, a)
    );
    return merged;
  } catch (e) {
    console.warn("Could not load state, starting fresh", e);
    return structuredClone(DEFAULT_STATE);
  }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
}

async function loadKnowledge() {
  // Prefer an inlined corpus when available — single-file builds (BreakFree.html)
  // ship with `window.__KNOWLEDGE_INLINE` so the app works without any fetch().
  if (typeof window !== "undefined" && window.__KNOWLEDGE_INLINE) {
    KNOWLEDGE = window.__KNOWLEDGE_INLINE;
    return KNOWLEDGE;
  }
  try {
    const r = await fetch(KNOWLEDGE_URL, { cache: "no-store" });
    if (!r.ok) throw new Error("knowledge fetch failed " + r.status);
    KNOWLEDGE = await r.json();
    return KNOWLEDGE;
  } catch (e) {
    console.warn("knowledge.json not loaded:", e);
    KNOWLEDGE = { modalities: {}, docs: [], chunks: [] };
    return KNOWLEDGE;
  }
}

function uid() {
  return Math.random().toString(36).slice(2, 10);
}

function todayKey(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function startOfMonth(d) {
  return new Date(d.getFullYear(), d.getMonth(), 1);
}

function fmtDate(d, opts = {}) {
  return new Date(d).toLocaleString(undefined, {
    month: "short",
    day: "numeric",
    ...opts
  });
}

function fmtTime(d) {
  return new Date(d).toLocaleTimeString(undefined, {
    hour: "numeric",
    minute: "2-digit"
  });
}

function relTime(ts) {
  const diff = (Date.now() - new Date(ts).getTime()) / 1000;
  if (diff < 60) return "just now";
  if (diff < 3600) return `${Math.round(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.round(diff / 3600)}h ago`;
  return `${Math.round(diff / 86400)}d ago`;
}

function navigate(next) {
  route = next;
  $$(".nav-item").forEach((b) =>
    b.classList.toggle("active", b.dataset.route === next)
  );
  render();
}

function render() {
  const main = $("#app");
  const tpl = $(`#tpl-${route}`);
  if (!tpl) {
    main.innerHTML = `<p>Unknown view: ${route}</p>`;
    return;
  }
  main.innerHTML = "";
  main.appendChild(tpl.content.cloneNode(true));

  if (route === "home") renderHome();
  if (route === "calendar") renderCalendar();
  if (route === "create") renderCreate();
  if (route === "help") renderHelp();
}

function renderHome() {
  const greetings = greetingsByHour();
  $("#home-greeting").textContent = greetings.title;
  $("#home-lede").textContent = greetings.lede;

  const today = new Date();
  const cal = $("#home-calendar");
  cal.innerHTML = "";
  const start = new Date(today);
  start.setDate(today.getDate() - today.getDay());
  for (let i = 0; i < 14; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    const cell = document.createElement("div");
    if (todayKey(d) === todayKey()) cell.classList.add("today");
    const acts = activationsOnDay(d);
    if (acts.some((a) => a.modality === "ba") || goalsOnDay(d).length)
      cell.classList.add("has", "ba");
    if (acts.some((a) => a.modality === "ivex"))
      cell.classList.add("has-ivex", "ivex");
    cell.title = fmtDate(d);
    cal.appendChild(cell);
  }

  const baCount = STATE.activations.filter((a) => a.modality === "ba").length;
  const ivexCount = STATE.activations.filter((a) => a.modality === "ivex").length;
  $("#home-create-stat").textContent = (baCount + ivexCount)
    ? `${baCount} activation${baCount===1?"":"s"} • ${ivexCount} exposure${ivexCount===1?"":"s"}`
    : "No plans yet — start with one tiny step.";
  $("#home-modality-stat").textContent = baCount + ivexCount
    ? `${baCount + ivexCount} total steps planned`
    : "";

  const recent = $("#home-recent");
  recent.innerHTML = "";
  const items = recentActivity().slice(0, 4);
  if (!items.length) {
    recent.innerHTML = `<div class="stream-empty">Nothing logged yet. Anything counts.</div>`;
  } else {
    items.forEach((it) => recent.appendChild(streamItem(it)));
  }

  const note = STATE.coach.memory.filter((m) => m.role === "coach").slice(-1)[0];
  if (note) $("#home-coach-note").textContent = note.text;

  const chipRow = $("#home-coach-chips");
  chipRow.innerHTML = "";
  topUserTopics(5).forEach((t) => {
    const c = document.createElement("span");
    c.className = "chip";
    c.textContent = t;
    chipRow.appendChild(c);
  });

  $("#home-open-coach").addEventListener("click", openCoach);
  $("[data-action='quick-checkin']").addEventListener("click", () => {
    openCoach();
    coachSend("let's do a quick check-in", { silent: true });
  });

  $$(".card.preview").forEach((card) =>
    card.addEventListener("click", () => navigate(card.dataset.route))
  );
}

function greetingsByHour() {
  const p = STATE.profile;
  const namePart = p.name ? `, ${p.name}` : "";
  const h = new Date().getHours();
  if (h < 5)
    return {
      title: `It's late${namePart}. Be gentle.`,
      lede: "Even a glass of water counts as showing up."
    };
  if (h < 12)
    return {
      title: `Good morning${namePart}.`,
      lede: "One small move can shape the whole day."
    };
  if (h < 17)
    return {
      title: `Hello${namePart}.`,
      lede: "If today's been heavy, the smallest step still counts."
    };
  if (h < 22)
    return {
      title: `Easing into the evening${namePart}.`,
      lede: "What would feel kind to do next?"
    };
  return {
    title: `Quiet hours${namePart}.`,
    lede: "Anything restful counts as activation."
  };
}

function activationsOnDay(d) {
  const key = todayKey(d);
  return STATE.activations.filter(
    (a) => a.scheduledFor && todayKey(new Date(a.scheduledFor)) === key
  );
}

function goalsOnDay(d) {
  const key = todayKey(d);
  return STATE.goals.filter(
    (g) => g.targetDate && todayKey(new Date(g.targetDate)) === key
  );
}

function recentActivity() {
  const items = [];
  STATE.activations.forEach((a) =>
    items.push({
      kind: a.modality === "ivex" ? "ivex" : "activation",
      modality: a.modality || "ba",
      id: a.id,
      title: a.title,
      sub: subFor(a),
      ts: a.createdAt,
      completed: !!a.completed
    })
  );
  STATE.logs.forEach((l) =>
    items.push({
      kind: l.type,
      id: l.id,
      title: l.content,
      sub: relTime(l.ts),
      ts: l.ts
    })
  );
  return items.sort((a, b) => new Date(b.ts) - new Date(a.ts));
}

function subFor(a) {
  const tag = a.modality === "ivex" ? "Exposure" : "Activation";
  const energy = a.modality === "ivex" && a.energy
    ? ` • SUDS ~${Number(a.energy) * 20}`
    : "";
  return `${tag} • ${a.category} • ${a.duration || "?"} min${energy}${
    a.scheduledFor ? " • " + fmtDate(a.scheduledFor) : ""
  }`;
}

function topUserTopics(n) {
  const counts = STATE.coach.topicCounts || {};
  return Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .slice(0, n)
    .map(([t]) => t);
}

function streamItem(item) {
  const el = document.createElement("div");
  const cls = item.kind === "ivex" ? "ivex" : (item.kind || "");
  el.className = `stream-item ${cls}${item.completed ? " completed" : ""}`;
  el.innerHTML = `
    <div>
      <div class="title">${escapeHtml(item.title || "")}</div>
      <div class="sub">${escapeHtml(item.sub || "")}</div>
    </div>
    <div class="actions"></div>
  `;
  if ((item.kind === "activation" || item.kind === "ivex") && !item.completed && item.id) {
    const btn = document.createElement("button");
    btn.className = "ghost small";
    btn.textContent = "Mark done";
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      completeActivation(item.id);
    });
    $(".actions", el).appendChild(btn);
  }
  return el;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;"
  }[c]));
}

function completeActivation(id) {
  const a = STATE.activations.find((x) => x.id === id);
  if (!a) return;
  a.completed = true;
  a.completedAt = new Date().toISOString();
  STATE.logs.push({
    id: uid(),
    type: "complete",
    content: `Did "${a.title}"`,
    ts: a.completedAt
  });
  saveState();
  render();
}

function renderCalendar() {
  $("#cal-prev").addEventListener("click", () => {
    calendarCursor = new Date(
      calendarCursor.getFullYear(),
      calendarCursor.getMonth() - 1,
      1
    );
    drawCalendar();
  });
  $("#cal-next").addEventListener("click", () => {
    calendarCursor = new Date(
      calendarCursor.getFullYear(),
      calendarCursor.getMonth() + 1,
      1
    );
    drawCalendar();
  });
  drawCalendar();
}

function drawCalendar() {
  $("#cal-label").textContent = calendarCursor.toLocaleString(undefined, {
    month: "long",
    year: "numeric"
  });

  const grid = $("#cal-grid");
  grid.innerHTML = "";
  ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].forEach((d) => {
    const h = document.createElement("div");
    h.className = "cal-cell head";
    h.textContent = d;
    grid.appendChild(h);
  });

  const first = startOfMonth(calendarCursor);
  const startDay = first.getDay();
  const daysInMonth = new Date(
    calendarCursor.getFullYear(),
    calendarCursor.getMonth() + 1,
    0
  ).getDate();
  const total = Math.ceil((startDay + daysInMonth) / 7) * 7;

  for (let i = 0; i < total; i++) {
    const d = new Date(first);
    d.setDate(1 + (i - startDay));
    const cell = document.createElement("div");
    cell.className = "cal-cell";
    if (d.getMonth() !== calendarCursor.getMonth()) cell.classList.add("dim");
    if (todayKey(d) === todayKey()) cell.classList.add("today");
    if (todayKey(d) === calendarSelected) cell.classList.add("selected");

    const num = document.createElement("div");
    num.className = "num";
    num.textContent = d.getDate();
    cell.appendChild(num);

    const marks = document.createElement("div");
    marks.className = "marks";
    activationsOnDay(d).forEach((a) => {
      const m = document.createElement("span");
      const klass = a.completed
        ? "done"
        : a.modality === "ivex"
        ? "ivex"
        : "";
      m.className = "mark" + (klass ? " " + klass : "");
      marks.appendChild(m);
    });
    goalsOnDay(d).forEach(() => {
      const m = document.createElement("span");
      m.className = "mark goal";
      marks.appendChild(m);
    });
    cell.appendChild(marks);

    cell.addEventListener("click", () => {
      calendarSelected = todayKey(d);
      drawCalendar();
    });
    grid.appendChild(cell);
  }

  const list = $("#cal-day-list");
  list.innerHTML = "";
  const items = activationsOnDay(new Date(calendarSelected));
  $("#cal-day-title").textContent = `${new Date(
    calendarSelected
  ).toLocaleString(undefined, {
    weekday: "long",
    month: "short",
    day: "numeric"
  })}`;

  if (!items.length) {
    list.innerHTML = `<div class="stream-empty">Nothing scheduled. Want to add a small step?</div>`;
  } else {
    items.forEach((a) =>
      list.appendChild(
        streamItem({
          kind: a.modality === "ivex" ? "ivex" : "activation",
          modality: a.modality || "ba",
          id: a.id,
          title: a.title,
          sub: subFor(a),
          ts: a.createdAt,
          completed: !!a.completed
        })
      )
    );
  }

  const goalsBox = $("#cal-goals");
  goalsBox.innerHTML = "";
  if (!STATE.goals.length) {
    goalsBox.innerHTML = `<div class="stream-empty">No goals yet. Goals give your steps meaning.</div>`;
  } else {
    STATE.goals.forEach((g) =>
      goalsBox.appendChild(
        streamItem({
          kind: "goal",
          id: g.id,
          title: g.title,
          sub: `${g.value || ""}${
            g.targetDate ? " • by " + fmtDate(g.targetDate) : ""
          }`,
          ts: g.createdAt
        })
      )
    );
  }
}

function renderCreate() {
  refreshGoalSelect();
  applyCreateModality(createModality);

  $$(".seg-btn[data-modality]").forEach((b) =>
    b.addEventListener("click", () => {
      createModality = b.dataset.modality;
      $$(".seg-btn[data-modality]").forEach((x) =>
        x.classList.toggle("active", x.dataset.modality === createModality)
      );
      applyCreateModality(createModality);
    })
  );

  $("#create-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const f = e.currentTarget;
    const data = Object.fromEntries(new FormData(f).entries());
    if (!data.title) return;
    const a = {
      id: uid(),
      modality: createModality,
      title: data.title.trim(),
      value: data.value?.trim() || "",
      category: data.category,
      energy: Number(data.energy || 3),
      duration: Number(data.duration || 15),
      scheduledFor: data.when || null,
      linkedGoalId: data.goalId || null,
      safety: data.safety?.trim() || "",
      notes: data.notes?.trim() || "",
      createdAt: new Date().toISOString(),
      completed: false
    };
    STATE.activations.push(a);
    STATE.logs.push({
      id: uid(),
      type: "reflection",
      content: `Planned ${
        createModality === "ivex" ? "exposure" : "activation"
      } "${a.title}"`,
      ts: a.createdAt
    });
    saveState();
    f.reset();
    render();
    toast(`Added "${a.title}". You're showing up.`);
  });

  $("#create-add-goal").addEventListener("click", () => {
    const title = prompt(
      "What's a goal you're moving toward? Keep it warm and human."
    );
    if (!title) return;
    const value = prompt("Why does this goal matter to you?") || "";
    const targetDate =
      prompt("Optional: target date (YYYY-MM-DD)") || null;
    const g = {
      id: uid(),
      title: title.trim(),
      value: value.trim(),
      targetDate: targetDate?.trim() || null,
      createdAt: new Date().toISOString(),
      status: "open"
    };
    STATE.goals.push(g);
    saveState();
    render();
  });

  const list = $("#create-list");
  list.innerHTML = "";
  $("#create-count").textContent = `${STATE.activations.length} saved`;
  if (!STATE.activations.length) {
    list.innerHTML = `<div class="stream-empty">No steps yet. Even a 5-minute step is a real step.</div>`;
  } else {
    [...STATE.activations]
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
      .forEach((a) =>
        list.appendChild(
          streamItem({
            kind: a.modality === "ivex" ? "ivex" : "activation",
            modality: a.modality || "ba",
            id: a.id,
            title: a.title,
            sub: subFor(a),
            ts: a.createdAt,
            completed: !!a.completed
          })
        )
      );
  }

  const goalsBox = $("#create-goals");
  goalsBox.innerHTML = "";
  if (!STATE.goals.length) {
    goalsBox.innerHTML = `<div class="stream-empty">No goals yet.</div>`;
  } else {
    STATE.goals.forEach((g) =>
      goalsBox.appendChild(
        streamItem({
          kind: "goal",
          id: g.id,
          title: g.title,
          sub: `${g.value || ""}${
            g.targetDate ? " • by " + fmtDate(g.targetDate) : ""
          }`,
          ts: g.createdAt
        })
      )
    );
  }
}

function applyCreateModality(modality) {
  const form = $("#create-form");
  if (!form) return;
  form.querySelector("input[name='modality']").value = modality;
  $("#create-submit").textContent =
    modality === "ivex" ? "Save exposure" : "Save activation";

  $$("[data-label-for]", form).forEach((el) => {
    el.textContent = el.dataset[modality] || el.textContent;
  });
  $$("[data-ba][placeholder]", form).forEach((el) => {
    el.setAttribute(
      "placeholder",
      el.dataset[modality] || el.getAttribute("placeholder")
    );
  });

  $$(".ivex-only", form).forEach((el) => {
    const show = modality === "ivex";
    el.hidden = !show;
    el.style.display = show ? "" : "none";
  });
}

function refreshGoalSelect() {
  const sel = $("#create-goal-select");
  if (!sel) return;
  sel.innerHTML = `<option value="">—</option>`;
  STATE.goals.forEach((g) => {
    const o = document.createElement("option");
    o.value = g.id;
    o.textContent = g.title;
    sel.appendChild(o);
  });
}

function renderHelp() {
  $$("[data-help]").forEach((b) =>
    b.addEventListener("click", () => {
      openCoach();
      const k = b.dataset.help;
      const prompts = {
        "low-energy":
          "I'm low energy right now. Help me shrink today's plan into the smallest possible step.",
        avoidance:
          "I think I'm avoiding something. Help me name it kindly and pick a small in-vivo exposure step.",
        "didnt-help":
          "What I tried didn't help. Help me look at the data without judging it, and decide whether to change category, shrink the step, or stay with it longer."
      };
      coachSend(prompts[k] || "Help me get unstuck.", { silent: false });
    })
  );

  const patterns = derivePatterns();
  const box = $("#help-patterns");
  box.innerHTML = "";
  if (!patterns.length) {
    box.innerHTML = `<div class="stream-empty">Once you've logged a few steps, patterns will show up here.</div>`;
  } else {
    patterns.forEach((p) =>
      box.appendChild(
        streamItem({
          kind: "reflection",
          title: p.title,
          sub: p.sub,
          ts: new Date().toISOString()
        })
      )
    );
  }

  const sources = $("#help-sources");
  if (sources) {
    sources.innerHTML = "";
    const docs = (KNOWLEDGE && KNOWLEDGE.docs) || [];
    if (!docs.length) {
      sources.innerHTML = `<li class="muted">${
        KNOWLEDGE ? "Knowledge index unavailable." : "Knowledge index loading…"
      }</li>`;
      if (!KNOWLEDGE) KNOWLEDGE_PROMISE.then(() => route === "help" && renderHelp());
    } else {
      docs.forEach((d) => {
        const li = document.createElement("li");
        li.innerHTML = `<strong>${escapeHtml(d.label)}</strong> <span class="muted">— used as background, never quoted directly.</span>`;
        sources.appendChild(li);
      });
    }
  }
}

function derivePatterns() {
  const out = [];
  if (!STATE.activations.length) return out;
